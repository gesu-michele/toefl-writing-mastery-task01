    :root {
      --bg-canvas: #040914;
      --bg-panel: rgba(10, 19, 36, 0.85);
      --bg-card: rgba(16, 29, 54, 0.7);
      --bg-card-inner: rgba(7, 14, 28, 0.75);
      --border-subtle: rgba(56, 189, 248, 0.15);
      --border-glow: rgba(56, 189, 248, 0.4);
      --border-gold: rgba(212, 175, 55, 0.4);
      --accent-gold: #d4af37;
      --accent-blue: #2563eb;
      --accent-blue-light: #60a5fa;
      --accent-cyan: #38bdf8;
      --accent-green: #10b981;
      --accent-red: #ef4444;

      --text-muted: #94a3b8;

    * {

      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-canvas);

      min-height: 100vh;
      display: flex;
      flex-direction: column;

        radial-gradient(circle at 15% 85%, rgba(212, 175, 55, 0.12) 0%, transparent 45%),
        radial-gradient(circle at 50% 50%, rgba(37, 99, 235, 0.1) 0%, transparent 60%),
        linear-gradient(to bottom, #02050c, #060e1d 60%, #03060f);
      background-attachment: fixed;
    }

    .top-nav {
      height: 64px;
      background: rgba(6, 12, 23, 0.85);
      border-bottom: 1px solid rgba(56, 189, 248, 0.2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 36px;
      backdrop-filter: blur(16px);
      z-index: 100;

    .nav-brand-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .toefl-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #ffffff;
      padding: 4px 10px;
      border-radius: 5px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
      user-select: none;
    }

    .toefl-spark {
      width: 16px;
      height: 16px;
      fill: var(--toefl-brand-blue);
    }

    .toefl-name {
      font-family: 'Inter', sans-serif;
      font-weight: 800;
      font-size: 13.5px;
      color: var(--toefl-brand-blue);
      letter-spacing: -0.4px;
      line-height: 1;
    }

    .nav-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent-cyan);
      letter-spacing: 0.5px;
      font-family: 'Space Grotesk', sans-serif;
      text-transform: uppercase;
    }

    .nav-brand-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .candidate-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      font-weight: 700;
      color: #e2e8f0;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 5px 12px;
      border-radius: 6px;
      backdrop-filter: blur(8px);
    }

    .candidate-tag span {
      color: var(--accent-gold);
    }

    .exam-mode-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(212, 175, 55, 0.15);
      border: 1px solid rgba(212, 175, 55, 0.4);
      padding: 5px 14px;
      border-radius: 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      font-weight: 800;
      color: var(--accent-gold);
    }

    .company-logo-slot {
      height: 38px;
      max-width: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .company-logo-slot img {
      max-height: 100%;
      max-width: 100%;
      object-fit: contain;
    }

    .main-layout {
      flex: 1;
      max-width: 1120px;
      width: 100%;
      margin: 0 auto;
      padding: 30px 24px 40px 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .progress-bar-shell {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      height: 9px;
      border-radius: 9999px;
      margin-bottom: 24px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
    }

    .progress-bar-glow {
      height: 100%;
      width: 4%;
      background: linear-gradient(90deg, #2563eb, #38bdf8, #d4af37);
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.8);
      transition: width 0.3s ease;
    }

    .exercise-card {
      background: var(--bg-card);
      border: 1.5px solid var(--border-subtle);
      border-radius: 20px;
      padding: 36px 44px;
      box-shadow: var(--shadow-deep);
      backdrop-filter: blur(20px);
      position: relative;
    }

    .exercise-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.6), transparent);
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 14px;
    }

    .item-counter {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13.5px;
      font-weight: 800;
      color: var(--accent-gold);
      letter-spacing: 1.5px;
    }

    .item-difficulty-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      color: var(--accent-cyan);
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 4px 10px;
      border-radius: 6px;
    }

    .sentence-prompt {
      font-size: 21.5px;
      line-height: 1.7;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 28px;
    }

    .blank-dropzone {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      min-height: 52px;
      min-width: 240px;
      border: 2px dashed rgba(212, 175, 55, 0.7);
      background: rgba(212, 175, 55, 0.06);
      padding: 4px 10px;
      border-radius: 10px;
      vertical-align: middle;
      gap: 8px;
      box-shadow: inset 0 0 14px rgba(212, 175, 55, 0.1);
    }

    .blank-placeholder {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: rgba(212, 175, 55, 0.7);
      font-weight: 600;
      user-select: none;
      font-style: italic;
    }

    .chips-section-title {
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .chips-staging-area {
      background: var(--bg-card-inner);
      border: 1.5px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 20px;
      min-height: 96px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 26px;
      box-shadow: inset 0 3px 10px rgba(0, 0, 0, 0.6);
    }

    .word-chip {
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 600;
      padding: 10px 18px;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 1.5px solid rgba(96, 165, 250, 0.25);
      color: #f1f5f9;
      border-radius: 10px;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: inline-flex;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .word-chip:hover {
      border-color: var(--accent-cyan);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(56, 189, 248, 0.3);
      color: #ffffff;
    }

    .word-chip.slotted {
      background: linear-gradient(135deg, #1d4ed8 0%, #1e3a8a 100%);
      border-color: #60a5fa;
      color: #ffffff;
    }

    .word-chip.slotted:hover {
      border-color: #ef4444;
      background: linear-gradient(135deg, #991b1b 0%, #7f1d1d 100%);
    }

    .controls-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .btn-act {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 700;
      padding: 13px 26px;
      border-radius: 9px;
      cursor: pointer;
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .btn-outline {
      background: rgba(255, 255, 255, 0.03);
      border-color: rgba(255, 255, 255, 0.15);
      color: #94a3b8;
    }

    .btn-outline:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.3);
    }

    .btn-primary {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: #ffffff;
      border: 1px solid rgba(96, 165, 250, 0.4);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
    }

    .btn-primary:hover:not(:disabled) {
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      transform: translateY(-2px);
    }

    .btn-primary:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      box-shadow: none;
    }

    .results-card {
      background: var(--bg-card);
      border: 1.5px solid var(--border-gold);
      border-radius: 20px;
      padding: 44px 36px;
      text-align: center;
      box-shadow: var(--shadow-deep);
      backdrop-filter: blur(20px);
    }

    .results-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 32px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .results-subtitle {
      font-size: 14.5px;
      color: var(--text-muted);
      margin-bottom: 28px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 16px;
      margin-bottom: 30px;
    }

    .stat-box {
      background: var(--bg-card-inner);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 20px 16px;
    }

    .stat-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 28px;
      font-weight: 800;
      color: var(--accent-gold);
      margin-bottom: 4px;
    }

    .stat-lbl {
      font-size: 11.5px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .audit-section {
      text-align: left;
      margin-top: 36px;
      margin-bottom: 30px;
    }

    .audit-section-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--accent-cyan);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .audit-item-box {
      background: var(--bg-card-inner);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 18px 22px;
      margin-bottom: 14px;
      border-left: 4px solid #334155;
    }

    .audit-item-box.correct {
      border-left-color: var(--accent-green);
    }

    .audit-item-box.incorrect {
      border-left-color: var(--accent-red);
    }

    .audit-item-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 12px;
      font-family: 'JetBrains Mono', monospace;
    }

    .audit-verdict-tag {
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 4px;
    }

    .audit-verdict-tag.correct {
      color: #6ee7b7;
      background: rgba(16, 185, 129, 0.15);
    }

    .audit-verdict-tag.incorrect {
      color: #fca5a5;
      background: rgba(239, 68, 68, 0.15);
    }

    .audit-prompt {
      font-size: 14.5px;
      color: #cbd5e1;
      margin-bottom: 8px;
      line-height: 1.5;
    }

    .audit-line {
      font-size: 13.5px;
      margin-bottom: 4px;
      line-height: 1.4;
    }

    .audit-line strong {
      font-weight: 700;
    }

    .audit-rule-hint {
      font-size: 12px;
      font-style: italic;
      color: var(--accent-gold);
      margin-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 6px;
    }

    .footer-bar {
      padding: 14px 36px;
      background: #02050c;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: #64748b;
    }

    @media (max-width: 860px) {
      .exercise-card {
        padding: 26px 20px;
      }
      .sentence-prompt {
        font-size: 18px;
      }
      .top-nav {
        padding: 0 18px;
      }
      .controls-row {
        flex-direction: column-reverse;
      }
      .btn-act {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>

  <script>
    // BANCO VALIDADO 51 AL 75 (Sintaxis C1+ Desafiante y Combinada)
    const mockExercisesPart3 = [
      {
        id: 51,
        level: "Verbal Complementation & Legal Causative",
        pre: "Under stringent environmental mandates, municipal water utilities",
        post: "before discharging industrial effluents into river basins.",
        fragments: ["are", "legally", "compelled", "to", "neutralize", "toxic", "contaminants"],
        target: "are legally compelled to neutralize toxic contaminants",
        hint: "Passive structure with an interpolated adverb followed by an obligatory to-infinitive complement."
      },
      {
        id: 52,
        level: "Negative Frequency Inversion & Correlative Scale",
        pre: "Seldom has an economic crisis",
        post: "as the sudden supply chain collapse during the early pandemic.",
        fragments: ["inflicted", "such", "widespread", "structural", "disruption", "on", "global", "markets"],
        target: "inflicted such widespread structural disruption on global markets",
        hint: "Complete the inverted past participle predicate followed by 'such + [noun phrase] + on [object]'."
      },
      {
        id: 53,
        level: "Correlative Subject-Verb Proximity",
        pre: "Sociolinguistic studies show that neither the regional dialects nor",
        post: "completely isolated from digital media influences.",
        fragments: ["the", "formal", "standard", "vernacular", "remains"],
        target: "the formal standard vernacular remains",
        hint: "In 'neither... nor', the singular noun closest to the verb ('vernacular') dictates 'remains'."
      },
      {
        id: 54,
        level: "Royal Order of Adjectives & Noun Density",
        pre: "Paleontologists excavated remnants of",
        post: "preserved beneath layers of volcanic ash.",
        fragments: ["two", "exceptionally", "well-preserved", "carnivorous", "Cretaceous", "theropods"],
        target: "two exceptionally well-preserved carnivorous Cretaceous theropods",
        hint: "Sequence: Number + Evaluative Compound Participle + Physical Trait + Geological Period + Head Noun."
      },
      {
        id: 55,
        level: "Verbal Regime & Prepositional Gerund",
        pre: "Despite severe budget contractions, the university laboratory succeeded",
        post: "into commercial battery technology.",
        fragments: ["in", "translating", "its", "solid-state", "physics", "breakthroughs"],
        target: "in translating its solid-state physics breakthroughs",
        hint: "Collocation: 'succeed IN [gerund]' followed by a compound premodified noun object."
      },
      {
        id: 56,
        level: "Formal Inverted 2nd Conditional (Were)",
        pre: "Were commercial fusion reactors",
        post: "within the next decade, baseline energy economics would transform overnight.",
        fragments: ["to", "achieve", "sustained", "net-positive", "electrical", "output"],
        target: "to achieve sustained net-positive electrical output",
        hint: "'Were + Subject + TO-infinitive' creates an elevated formal conditional without 'if'."
      },
      {
        id: 57,
        level: "Partitive Distributive Agreement",
        pre: "The appellate judge ruled that each of the confiscated",
        post: "retained by federal archivists pending trial.",
        fragments: ["diplomatic", "communication", "logs", "was", "lawfully"],
        target: "diplomatic communication logs was lawfully",
        hint: "'Each of [plural nouns]' is grammatically singular and requires the singular auxiliary 'was'."
      },
      {
        id: 58,
        level: "Reduced Active Participle Clause",
        pre: "Satellite tracking equipment detected large swarms of desert locusts",
        post: "across the Red Sea corridor.",
        fragments: ["migrating", "northward", "at", "unprecedented", "speeds"],
        target: "migrating northward at unprecedented speeds",
        hint: "Reduced relative clause using active present participle '-ing' + directional adverb + prepositional phrase."
      },
      {
        id: 59,
        level: "Verbal Separation Regime (Dissuade from)",
        pre: "The institutional review board strictly dissuades clinical researchers",
        post: "unverified experimental dosages.",
        fragments: ["from", "administering", "potentially", "fatal", "doses", "of"],
        target: "from administering potentially fatal doses of",
        hint: "'Dissuade [object] FROM [gerund]' followed by an adverbially modified noun phrase and dependent preposition."
      },
      {
        id: 60,
        level: "Correlative Inversion Balance (Not only... but also)",
        pre: "Not only did the central bank raise benchmark interest rates,",
        post: "credit expansion across commercial lenders.",
        fragments: ["but", "it", "also", "curbed", "excessive"],
        target: "but it also curbed excessive",
        hint: "Correlative balance: 'Not only did S V..., but [subject] also [finite past verb] [adjective]'."
      },
      {
        id: 61,
        level: "Reduced Passive Participle Coordination",
        pre: "Archival restoration experts managed to reconstruct an ancient manuscript",
        post: "by smoke and water during the monastic fire.",
        fragments: ["heavily", "damaged", "and", "partially", "effaced"],
        target: "heavily damaged and partially effaced",
        hint: "Coordinated past participle modifiers with internal manner adverbs modifying 'manuscript'."
      },
      {
        id: 62,
        level: "Formal Inverted 3rd Conditional (Had)",
        pre: "Had foreign ministry diplomats",
        post: "during the initial border clashes, the full-scale conflict might have been averted.",
        fragments: ["intervened", "decisively", "and", "without", "partisan", "bias"],
        target: "intervened decisively and without partisan bias",
        hint: "'Had + Subject + [past participle]' followed by manner adverb and parallel prepositional phrase."
      },
      {
        id: 63,
        level: "Compound Perfect Gerund & Premodification",
        pre: "The investigative panel criticized the transit authority for",
        post: "safety recommendations issued after the derailment.",
        fragments: ["having", "repeatedly", "ignored", "urgent", "track"],
        target: "having repeatedly ignored urgent track",
        hint: "Preposition + perfect gerund ('having ignored') with embedded frequency adverb and noun adjunct."
      },
      {
        id: 64,
        level: "Formal Singular None & Adverbial Balance",
        pre: "Recent ethnographic surveys reveal that none of the surveyed indigenous settlements",
        post: "fully dependent on urban welfare.",
        fragments: ["is", "currently", "or", "exclusively"],
        target: "is currently or exclusively",
        hint: "Formal ETS syntax treats 'none' as singular ('is') followed by balanced coordinated adverbs."
      },
      {
        id: 65,
        level: "Restrictive Frequency Inversion (Rarely)",
        pre: "Rarely do high-altitude atmospheric currents",
        post: "predicted by conventional meteorological simulations.",
        fragments: ["behave", "in", "the", "exact", "manner"],
        target: "behave in the exact manner",
        hint: "'Rarely do [subject]' requires the base infinitive verb followed by its prepositional complement."
      },
      {
        id: 66,
        level: "Mandative Subjunctive Mood",
        pre: "The hospital committee recommends that every intensive care practitioner",
        post: "recertification in advanced life support.",
        fragments: ["undergo", "rigorous", "annual", "clinical"],
        target: "undergo rigorous annual clinical",
        hint: "Subjunctive clause requirement: base form verb ('undergo', without -s) + adjective stack."
      },
      {
        id: 67,
        level: "Subordinate Noun Clause post Inversion",
        pre: "Little did the software engineers foresee that",
        post: "expose millions of user credentials to malicious exploitation.",
        fragments: ["an", "unnoticed", "coding", "omission", "would", "eventually"],
        target: "an unnoticed coding omission would eventually",
        hint: "That-clause subject noun phrase + modal auxiliary + temporal adverb preceding the base verb."
      },
      {
        id: 68,
        level: "Prepositional Gerund & Phrasal Architecture",
        pre: "The wildlife trust presented an ambitious proposal aimed at preventing poachers",
        post: "endangered black rhinoceros habitats.",
        fragments: ["from", "infiltrating", "densely", "forested", "zones", "within"],
        target: "from infiltrating densely forested zones within",
        hint: "'Prevent [object] FROM [gerund]' + adverb-adjective modifier + noun + relational preposition."
      },
      {
        id: 69,
        level: "Correlative Time Inversion (Scarcely... before)",
        pre: "Scarcely had the volcanic observatory issued the maximum alert level",
        post: "along the western flank.",
        fragments: ["before", "pyroclastic", "density", "currents", "descended", "rapidly"],
        target: "before pyroclastic density currents descended rapidly",
        hint: "Inversion connector: 'Scarcely had S V-ed BEFORE [subject noun phrase + past verb + adverb]'."
      },
      {
        id: 70,
        level: "Correlative Plural Agreement & Infinitive",
        pre: "The constitutional court ruled that neither the prime minister nor the cabinet secretaries",
        post: "decree without parliamentary debate.",
        fragments: ["were", "authorized", "to", "promulgate", "the", "emergency"],
        target: "were authorized to promulgate the emergency",
        hint: "Proximity rule: plural 'secretaries' dictates plural passive 'were authorized to [infinitive]'."
      },
      {
        id: 71,
        level: "Dense Prenominal Nominal Stack",
        pre: "Maritime archaeologists retrieved",
        post: "manufactured by Venetian workshops during the Renaissance.",
        fragments: ["several", "fragile", "hand-blown", "glass", "apothecary", "vessels"],
        target: "several fragile hand-blown glass apothecary vessels",
        hint: "Quantifier + Evaluative + Compound Technique + Material + Purpose/Type + Head Noun."
      },
      {
        id: 72,
        level: "Formal Inverted 1st Conditional (Should)",
        pre: "Should seismic tremors persist throughout the metropolitan area, civil protection units",
        post: "structural safety audits.",
        fragments: ["must", "immediately", "initiate", "mandatory", "building"],
        target: "must immediately initiate mandatory building",
        hint: "Conditional apodosis: modal auxiliary + manner adverb + transitive base verb + noun adjunct."
      },
      {
        id: 73,
        level: "Obligatory Preposition & Coordinated Perfect Gerund",
        pre: "The whistleblower admitted",
        post: "confidential memoranda regarding foreign subsidiary operations.",
        fragments: ["to", "having", "clandestinely", "copied", "and", "distributed"],
        target: "to having clandestinely copied and distributed",
        hint: "'Admit TO' followed by perfect auxiliary 'having' + adverb + coordinated past participles."
      },
      {
        id: 74,
        level: "Correlative Time Inversion (Hardly... when)",
        pre: "Hardly had the trade delegation signed the bilateral agreement",
        post: "across financial centers worldwide.",
        fragments: ["when", "unforeseen", "currency", "devaluations", "triggered", "panic"],
        target: "when unforeseen currency devaluations triggered panic",
        hint: "Correlative connector: 'Hardly had S V-ed WHEN [subject noun phrase + past verb + object]'."
      },
      {
        id: 75,
        level: "Mandative Subjunctive & Comparative Proportions",
        pre: "Urban planning authorities insisted that the commercial developer",
        post: "green space in the proposed plaza blueprint.",
        fragments: ["allocate", "a", "substantially", "larger", "portion", "of"],
        target: "allocate a substantially larger portion of",
        hint: "'Insisted that [subject]' takes the base form 'allocate' + adverbially boosted comparative phrase."
      }
    ];

    let currentIndex = 0;
    let studentResponsesPart3 = [];
    let slottedWords = [];
    let unslottedWords = [];

    // Persistencia centralizada
    const userProfileKey = "toefl_mastery_user_profile";
    const mockStorageKey = "toefl_mock_results";

    let candidateName = "Candidate";
    let priorPart1Score = 0;
    let priorPart2Score = 0;

    try {
      const rawProfile = localStorage.getItem(userProfileKey);
      if (rawProfile) {
        const parsed = JSON.parse(rawProfile);
        if (parsed.name) candidateName = parsed.name;
      }
    } catch(e) {}

    try {
      const rawMock = localStorage.getItem(mockStorageKey);
      if (rawMock) {
        const parsed = JSON.parse(rawMock);
        if (typeof parsed.part1Score === 'number') priorPart1Score = parsed.part1Score;
        if (typeof parsed.part2Score === 'number') priorPart2Score = parsed.part2Score;
      }
    } catch(e) {}

    document.getElementById("displayCandidate").innerText = candidateName;

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function renderCurrentExercise() {
      const ex = mockExercisesPart3[currentIndex];
      slottedWords = [];
      unslottedWords = shuffleArray(ex.fragments);

      const progressPct = ((currentIndex + 1) / mockExercisesPart3.length) * 100;
      document.getElementById("progressBar").style.width = `${progressPct}%`;

      const card = document.getElementById("cardContainer");
      const isLast = currentIndex === mockExercisesPart3.length - 1;

      card.innerHTML = `
        <div class="item-header">
          <span class="item-counter">ITEM ${ex.id} / 100</span>
          <span class="item-difficulty-pill">${ex.level}</span>
        </div>

        <div class="sentence-prompt">
          ${ex.pre}
          <span class="blank-dropzone" id="dropzoneArea">
            <span class="blank-placeholder" id="placeholderTxt">Click chips below to slot here...</span>
          </span>
          ${ex.post}
        </div>

        <div class="chips-section-title">
          <span>🧩</span> AVAILABLE SYNTACTIC CHIPS (CLICK TO INSERT • CLICK SLOTTED TO REMOVE):
        </div>
        <div class="chips-staging-area" id="chipsStaging"></div>

        <div class="controls-row">
          <button class="btn-act btn-outline" id="btnReset" onclick="resetSlots()">↺ Reset All Chips</button>
          <button class="btn-act btn-primary" id="btnSaveContinue" onclick="saveAndContinue()" disabled>
            ${isLast ? 'Finish & Audit Part 3 ➔' : 'Save & Next Question ➔'}
          </button>
        </div>
      `;

      renderChips();
    }

    function renderChips() {
      const staging = document.getElementById("chipsStaging");
      const dropzone = document.getElementById("dropzoneArea");
      const placeholder = document.getElementById("placeholderTxt");
      const btnSave = document.getElementById("btnSaveContinue");

      staging.innerHTML = "";
      unslottedWords.forEach((word, idx) => {
        const chip = document.createElement("button");
        chip.className = "word-chip";
        chip.innerText = word;
        chip.onclick = () => slotWord(idx);
        staging.appendChild(chip);
      });

      dropzone.innerHTML = "";
      if (slottedWords.length === 0) {
        dropzone.appendChild(placeholder);
      } else {
        slottedWords.forEach((word, idx) => {
          const chip = document.createElement("button");
          chip.className = "word-chip slotted";
          chip.innerText = word;
          chip.title = "Click to remove back to pool";
          chip.onclick = () => unslotWord(idx);
          dropzone.appendChild(chip);
        });
      }

      btnSave.disabled = slottedWords.length !== mockExercisesPart3[currentIndex].fragments.length;
    }

    function slotWord(index) {
      const word = unslottedWords.splice(index, 1)[0];
      slottedWords.push(word);
      renderChips();
    }

    function unslotWord(index) {
      const word = slottedWords.splice(index, 1)[0];
      unslottedWords.push(word);
      renderChips();
    }

    function resetSlots() {
      unslottedWords = [...unslottedWords, ...slottedWords];
      slottedWords = [];
      renderChips();
    }

    function saveAndContinue() {
      const ex = mockExercisesPart3[currentIndex];
      const builtSentence = slottedWords.join(" ").trim();
      const isCorrect = builtSentence.toLowerCase() === ex.target.toLowerCase();

      studentResponsesPart3.push({
        id: ex.id,
        level: ex.level,
        pre: ex.pre,
        post: ex.post,
        target: ex.target,
        submitted: builtSentence,
        isCorrect: isCorrect,
        hint: ex.hint
      });

      if (currentIndex < mockExercisesPart3.length - 1) {
        currentIndex++;
        renderCurrentExercise();
      } else {
        renderPart3AuditReport();
      }
    }

    function renderPart3AuditReport() {
      const scorePart3 = studentResponsesPart3.filter(r => r.isCorrect).length;
      const cumulativeScore75 = priorPart1Score + priorPart2Score + scorePart3;
      const pct75 = Math.round((cumulativeScore75 / 75) * 100);

      // Persistir sin borrar historiales
      try {
        let currentMockData = {};
        const stored = localStorage.getItem(mockStorageKey);
        if (stored) currentMockData = JSON.parse(stored);

        currentMockData.candidate = candidateName;
        currentMockData.part1Score = priorPart1Score;
        currentMockData.part2Score = priorPart2Score;
        currentMockData.part3Score = scorePart3;
        currentMockData.cumulative75 = cumulativeScore75;
        currentMockData.lastUpdated = new Date().toISOString();

        localStorage.setItem(mockStorageKey, JSON.stringify(currentMockData));
      } catch(e) {
        console.error("Error updating mock results:", e);
      }

      // Desglose de auditoría ítem por ítem
      const auditHtml = studentResponsesPart3.map(item => {
        const statusClass = item.isCorrect ? "correct" : "incorrect";
        const verdictText = item.isCorrect ? "✓ CORRECT" : "✗ SYNTACTIC BREAK";

        return `
          <div class="audit-item-box ${statusClass}">
            <div class="audit-item-header">
              <span style="color:var(--text-muted);">ITEM ${item.id} • ${item.level}</span>
              <span class="audit-verdict-tag ${statusClass}">${verdictText}</span>
            </div>
            <div class="audit-prompt">
              <em>${item.pre}</em> <strong>[ ... ]</strong> <em>${item.post}</em>
            </div>
            <div class="audit-line" style="color:${item.isCorrect ? '#6ee7b7' : '#fca5a5'};">
              <strong>Your Input:</strong> ${item.submitted}
            </div>
            ${!item.isCorrect ? `
              <div class="audit-line" style="color:#38bdf8;">
                <strong>Standard Target Order:</strong> ${item.target}
              </div>
            ` : ''}
            <div class="audit-rule-hint">
              <span>📎 Syntactic Principle:</span> ${item.hint}
            </div>
          </div>
        `;
      }).join('');

      const container = document.getElementById("mainContainer");
      container.innerHTML = `
        <div class="results-card">
          <div style="font-family:'JetBrains Mono'; font-size:12px; color:var(--accent-gold); font-weight:800; letter-spacing:1.5px; margin-bottom:10px;">
            BENCHMARK AUDIT • PART 3 COMPLETE
          </div>
          <h2 class="results-title">Items 51 to 75 Assessment</h2>
          <p class="results-subtitle">Candidate: <strong>${candidateName}</strong> • High-Density Inversion & Clausal Regimes</p>

          <div class="stats-grid">
            <div class="stat-box">
              <div class="stat-val">${scorePart3} / 25</div>
              <div class="stat-lbl">Part 3 Correct</div>
            </div>
            <div class="stat-box">
              <div class="stat-val">${cumulativeScore75} / 75</div>
              <div class="stat-lbl">Cumulative (1–75)</div>
            </div>
            <div class="stat-box">
              <div class="stat-val">${pct75}%</div>
              <div class="stat-lbl">Cumulative Precision</div>
            </div>
          </div>

          <div class="audit-section">
            <div class="audit-section-title">
              <span>📋</span> DRILL-BY-DRILL AUDIT (${scorePart3}/25 IN PART 3)
            </div>
            ${auditHtml}
          </div>

          <div style="display:flex; justify-content:center; gap:16px; flex-wrap:wrap; margin-top:30px;">
            <button class="btn-act btn-outline" onclick="window.location.href='./index.html'">
              <span>🏠</span> Return to Roadmap
            </button>
            <button class="btn-act btn-primary" onclick="window.location.href='./MOCK%2004.html'">
              <span>🚀</span> Proceed to Final Part 4 (Items 76–100) ➔
            </button>
          </div>
        </div>
      `;

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    renderCurrentExercise();
  </script>
</body>
</html>
