<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOEFL iBT Writing - Phase 05: Advanced Inversion - Dr. Jesús Miguel Lima E.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'AnanthaSignature';
      src: url('Anantha%20Signature%20For%20Personal%20Use.ttf') format('truetype'),
           url('Anantha Signature For Personal Use.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    :root {
      --bg-canvas: #040914;
      --bg-panel: rgba(10, 19, 36, 0.85);
      --bg-card: rgba(16, 29, 54, 0.7);
      --bg-card-inner: rgba(7, 14, 28, 0.75);
      --border-subtle: rgba(56, 189, 248, 0.15);
      --border-glow: rgba(56, 189, 248, 0.4);
      --border-gold: rgba(212, 175, 55, 0.4);
      --accent-gold: #d4af37;
      --accent-gold-soft: rgba(212, 175, 55, 0.12);
      --accent-blue: #2563eb;
      --accent-blue-light: #60a5fa;
      --accent-cyan: #38bdf8;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --toefl-brand-blue: #2B2B7A;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-spanish: #8192a9;
      --shadow-deep: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 30px rgba(37, 99, 235, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-canvas);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 85% 15%, rgba(56, 189, 248, 0.18) 0%, transparent 45%),
        radial-gradient(circle at 15% 85%, rgba(212, 175, 55, 0.12) 0%, transparent 45%),
        radial-gradient(circle at 50% 50%, rgba(37, 99, 235, 0.1) 0%, transparent 60%),
        linear-gradient(to bottom, #02050c, #060e1d 60%, #03060f);
      background-attachment: fixed;
    }

    .top-nav {
      height: 64px;
      background: rgba(6, 12, 23, 0.85);
      border-bottom: 1px solid rgba(56, 189, 248, 0.2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 36px;
      backdrop-filter: blur(16px);
      z-index: 100;
    }

    .nav-brand-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .toefl-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #ffffff;
      padding: 4px 10px;
      border-radius: 5px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
      user-select: none;
    }

    .toefl-spark {
      width: 16px;
      height: 16px;
      fill: var(--toefl-brand-blue);
    }

    .toefl-name {
      font-family: 'Inter', sans-serif;
      font-weight: 800;
      font-size: 13.5px;
      color: var(--toefl-brand-blue);
      letter-spacing: -0.4px;
      line-height: 1;
    }

    .nav-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent-cyan);
      letter-spacing: 0.5px;
      font-family: 'Space Grotesk', sans-serif;
      text-transform: uppercase;
    }

    .nav-brand-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .candidate-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      font-weight: 700;
      color: #e2e8f0;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 5px 12px;
      border-radius: 6px;
      backdrop-filter: blur(8px);
    }

    .candidate-tag span {
      color: var(--accent-gold);
    }

    .phase-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(37, 99, 235, 0.2);
      border: 1px solid rgba(96, 165, 250, 0.4);
      padding: 5px 14px;
      border-radius: 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 800;
      color: #93c5fd;
    }

    .company-logo-slot {
      height: 38px;
      max-width: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .company-logo-slot img {
      max-height: 100%;
      max-width: 100%;
      object-fit: contain;
    }

    .main-layout {
      flex: 1;
      max-width: 1120px;
      width: 100%;
      margin: 0 auto;
      padding: 30px 24px 40px 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .progress-bar-shell {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      height: 9px;
      border-radius: 9999px;
      margin-bottom: 24px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
    }

    .progress-bar-glow {
      height: 100%;
      width: 10%;
      background: linear-gradient(90deg, #2563eb, #38bdf8, #d4af37);
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.8);
      transition: width 0.3s ease;
    }

    .exercise-card {
      background: var(--bg-card);
      border: 1.5px solid var(--border-subtle);
      border-radius: 20px;
      padding: 36px 44px;
      box-shadow: var(--shadow-deep);
      backdrop-filter: blur(20px);
      position: relative;
    }

    .exercise-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.6), transparent);
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 14px;
    }

    .item-counter {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13.5px;
      font-weight: 800;
      color: var(--accent-gold);
      letter-spacing: 1.5px;
    }

    .item-difficulty-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      color: var(--accent-cyan);
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 4px 10px;
      border-radius: 6px;
    }

    .sentence-prompt {
      font-size: 21.5px;
      line-height: 1.7;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 28px;
    }

    .blank-dropzone {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      min-height: 52px;
      min-width: 240px;
      border: 2px dashed rgba(212, 175, 55, 0.7);
      background: rgba(212, 175, 55, 0.06);
      padding: 4px 10px;
      border-radius: 10px;
      vertical-align: middle;
      gap: 8px;
      box-shadow: inset 0 0 14px rgba(212, 175, 55, 0.1);
    }

    .blank-placeholder {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: rgba(212, 175, 55, 0.7);
      font-weight: 600;
      user-select: none;
      font-style: italic;
    }

    .mini-klippy-coach {
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(212, 175, 55, 0.07);
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 10px;
      padding: 10px 16px;
      margin-bottom: 24px;
    }

    .mini-klippy-icon {
      font-size: 22px;
    }

    .mini-klippy-msg {
      font-size: 13px;
      color: #cbd5e1;
      line-height: 1.4;
    }

    .mini-klippy-msg strong {
      color: var(--accent-gold);
    }

    .chips-section-title {
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .chips-staging-area {
      background: var(--bg-card-inner);
      border: 1.5px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 20px;
      min-height: 96px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 26px;
      box-shadow: inset 0 3px 10px rgba(0, 0, 0, 0.6);
    }

    .word-chip {
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 600;
      padding: 10px 18px;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 1.5px solid rgba(96, 165, 250, 0.25);
      color: #f1f5f9;
      border-radius: 10px;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: inline-flex;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .word-chip:hover {
      border-color: var(--accent-cyan);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(56, 189, 248, 0.3);
      color: #ffffff;
    }

    .word-chip.slotted {
      background: linear-gradient(135deg, #1d4ed8 0%, #1e3a8a 100%);
      border-color: #60a5fa;
      color: #ffffff;
    }

    .word-chip.slotted:hover {
      border-color: #ef4444;
      background: linear-gradient(135deg, #991b1b 0%, #7f1d1d 100%);
    }

    .controls-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .btn-act {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 700;
      padding: 13px 26px;
      border-radius: 9px;
      cursor: pointer;
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .btn-outline {
      background: rgba(255, 255, 255, 0.03);
      border-color: rgba(255, 255, 255, 0.15);
      color: #94a3b8;
    }

    .btn-outline:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.3);
    }

    .btn-primary {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: #ffffff;
      border: 1px solid rgba(96, 165, 250, 0.4);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
    }

    .btn-primary:hover:not(:disabled) {
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      transform: translateY(-2px);
    }

    .btn-primary:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-mock-launch {
      background: linear-gradient(135deg, #d4af37 0%, #b8860b 100%);
      color: #040914;
      border: 1.5px solid var(--accent-gold);
      box-shadow: 0 6px 25px rgba(212, 175, 55, 0.45);
      font-weight: 800;
    }

    .btn-mock-launch:hover {
      background: #facc15;
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(212, 175, 55, 0.7);
    }

    /* PANTALLA DE RESULTADOS DE FASE 05 */
    .results-card {
      background: var(--bg-card);
      border: 1.5px solid var(--accent-gold);
      border-radius: 20px;
      padding: 44px 36px;
      text-align: center;
      box-shadow: var(--shadow-deep);
      backdrop-filter: blur(20px);
    }

    .results-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 32px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .results-subtitle {
      font-size: 14.5px;
      color: var(--text-muted);
      margin-bottom: 28px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 16px;
      margin-bottom: 30px;
    }

    .stat-box {
      background: var(--bg-card-inner);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 20px 16px;
    }

    .stat-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 28px;
      font-weight: 800;
      color: var(--accent-gold);
      margin-bottom: 4px;
    }

    .stat-lbl {
      font-size: 11.5px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .toefl-unlock-box {
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.12) 0%, rgba(10, 19, 36, 0.95) 100%);
      border: 1.5px solid var(--accent-gold);
      border-radius: 16px;
      padding: 26px 28px;
      text-align: left;
      margin-bottom: 32px;
      box-shadow: 0 0 24px rgba(212, 175, 55, 0.2);
    }

    .toefl-unlock-box h4 {
      font-size: 16px;
      font-weight: 800;
      color: var(--accent-gold);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .footer-bar {
      padding: 14px 36px;
      background: #02050c;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: #64748b;
    }

    .footer-bar strong {
      color: #cbd5e1;
    }

    @media (max-width: 860px) {
      .exercise-card {
        padding: 26px 20px;
      }
      .sentence-prompt {
        font-size: 18px;
      }
      .top-nav {
        padding: 0 18px;
      }
      .controls-row {
        flex-direction: column-reverse;
      }
      .btn-act {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <header class="top-nav">
    <div class="nav-brand-left">
      <div class="toefl-badge">
        <svg class="toefl-spark" viewBox="0 0 100 100">
          <rect x="42" y="8" width="16" height="84" rx="4" transform="rotate(0 50 50)"/>
          <rect x="42" y="8" width="16" height="84" rx="4" transform="rotate(60 50 50)"/>
          <rect x="42" y="8" width="16" height="84" rx="4" transform="rotate(120 50 50)"/>
        </svg>
        <span class="toefl-name">toefl ibt</span>
      </div>
      <span class="nav-title">PHASE 05: ADVANCED INVERSION & SIMULATION</span>
    </div>

    <div class="nav-brand-right">
      <div class="candidate-tag">Candidate: <span id="displayCandidate">Candidate</span></div>
      <div class="phase-badge">Phase 05 / 05</div>
      <div class="company-logo-slot">
        <img src="logo.png" alt="JM ELT Solutions" onerror="this.style.display='none'">
      </div>
    </div>
  </header>

  <main class="main-layout" id="mainContainer">
    <div class="progress-bar-shell">
      <div class="progress-bar-glow" id="progressBar"></div>
    </div>

    <div class="exercise-card" id="cardContainer">
      <!-- Inyectado dinámicamente -->
    </div>
  </main>

  <footer class="footer-bar">
    <span>TOEFL iBT Writing: Build a Sentence • Master Benchmark</span>
    <span>Supervised by <strong>Dr. Jesús Miguel Lima E.</strong> • JM ELT Solutions</span>
  </footer>

  <script>
    // 10 EJERCICIOS CLAVE DE FASE 05: INVERSIÓN Y CONDICIONALES FORMALES
    const phase5Exercises = [
      {
        id: 1,
        topic: "Negative Adverb Fronting (Not only)",
        pre: "Not only did the clinical trial confirm the vaccine's safety,",
        post: "long-lasting immune response.",
        fragments: ["but", "it", "also", "induced", "a"],
        target: "but it also induced a",
        hint: "Inversion balance: 'Not only did S V..., but [S] also [V] [article]'."
      },
      {
        id: 2,
        topic: "Negative Prepositional Phrase Fronting",
        pre: "Under no circumstances should",
        post: "in unventilated laboratory cabinets.",
        fragments: ["volatile", "organic", "solvents", "be", "stored"],
        target: "volatile organic solvents be stored",
        hint: "Fronted negative phrase: Auxiliary ('should') + Subject + Passive base verb."
      },
      {
        id: 3,
        topic: "Frequency Inversion (Seldom)",
        pre: "Seldom have planetary astronomers observed",
        post: "during a single solar cycle.",
        fragments: ["so", "many", "consecutive", "coronal", "mass", "ejections"],
        target: "so many consecutive coronal mass ejections",
        hint: "Auxiliary has already inverted; position the quantifier head noun phrase."
      },
      {
        id: 4,
        topic: "Inverted 3rd Conditional (Had)",
        pre: "Had the architectural engineers reinforced the foundation pilings,",
        post: "the seismic shockwaves.",
        fragments: ["the", "bridge", "would", "have", "withstood"],
        target: "the bridge would have withstood",
        hint: "'Had S V-ed, [subject] would have [past participle]'."
      },
      {
        id: 5,
        topic: "Restrictive Frequency Inversion (Rarely)",
        pre: "Rarely does a single economic factor",
        post: "of international commodity markets.",
        fragments: ["dictate", "the", "overall", "pricing", "structure"],
        target: "dictate the overall pricing structure",
        hint: "'Rarely does [subject]' requires the bare infinitive verb."
      },
      {
        id: 6,
        topic: "Inverted 2nd Conditional (Were)",
        pre: "Were the state legislature to repeal the current subsidies,",
        post: "into financial insolvency.",
        fragments: ["several", "renewable", "energy", "firms", "would", "fall"],
        target: "several renewable energy firms would fall",
        hint: "'Were S to-infinitive, [subject] would [base verb]'."
      },
      {
        id: 7,
        topic: "Correlative Time Inversion (Hardly... when)",
        pre: "Hardly had the treaty been ratified by parliament",
        post: "protests erupted in capital cities.",
        fragments: ["when", "massive", "public", "demonstrations", "and"],
        target: "when massive public demonstrations and",
        hint: "'Hardly had [S] [V-ed] WHEN [coordinated subject] [verb]'."
      },
      {
        id: 8,
        topic: "Correlative Time Inversion (Scarcely... before)",
        pre: "Scarcely had the deep-sea submersible reached the trench",
        post: "began reporting critical sensor errors.",
        fragments: ["before", "the", "onboard", "navigation", "system"],
        target: "before the onboard navigation system",
        hint: "'Scarcely had [S] [V-ed] BEFORE [subject noun phrase] [verb]'."
      },
      {
        id: 9,
        topic: "Inverted 1st Conditional (Should)",
        pre: "Should unanticipated anomalies arise during orbital insertion,",
        post: "to override automated thrusters.",
        fragments: ["ground", "controllers", "are", "authorized", "manually"],
        target: "ground controllers are authorized manually",
        hint: "'Should S V, [main subject] are authorized [adverb] [infinitive]'."
      },
      {
        id: 10,
        topic: "Negative Degree Fronting (Little)",
        pre: "Little did the nineteenth-century botanists suspect",
        post: "the primary driver of rainforest pollination.",
        fragments: ["that", "nocturnal", "moths", "were", "actually"],
        target: "that nocturnal moths were actually",
        hint: "'Little did [S] suspect THAT [subject] were [adverb] [complement]'."
      }
    ];

    let currentIndex = 0;
    let score = 0;
    let slottedWords = [];
    let unslottedWords = [];

    const userProfileKey = "toefl_mastery_user_profile";
    let candidateName = "Candidate";

    try {
      const raw = localStorage.getItem(userProfileKey);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed.name) candidateName = parsed.name;
      }
    } catch(e) {}
    document.getElementById("displayCandidate").innerText = candidateName;

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function renderCurrentExercise() {
      const ex = phase5Exercises[currentIndex];
      slottedWords = [];
      unslottedWords = shuffleArray(ex.fragments);

      const progressPct = ((currentIndex + 1) / phase5Exercises.length) * 100;
      document.getElementById("progressBar").style.width = `${progressPct}%`;

      const card = document.getElementById("cardContainer");
      const isLast = currentIndex === phase5Exercises.length - 1;

      card.innerHTML = `
        <div class="item-header">
          <span class="item-counter">PRACTICE DRILL ${String(ex.id).padStart(2, '0')} / 10</span>
          <span class="item-difficulty-pill">${ex.topic}</span>
        </div>

        <div class="sentence-prompt">
          ${ex.pre}
          <span class="blank-dropzone" id="dropzoneArea">
            <span class="blank-placeholder" id="placeholderTxt">Click chips below to slot here...</span>
          </span>
          ${ex.post}
        </div>

        <div class="mini-klippy-coach">
          <span class="mini-klippy-icon">📎</span>
          <span class="mini-klippy-msg"><strong>Klippy's Clue:</strong> ${ex.hint}</span>
        </div>

        <div class="chips-section-title">
          <span>🧩</span> AVAILABLE SYNTACTIC CHIPS (CLICK TO INSERT • CLICK SLOTTED TO REMOVE):
        </div>
        <div class="chips-staging-area" id="chipsStaging"></div>

        <div class="controls-row">
          <button class="btn-act btn-outline" id="btnReset" onclick="resetSlots()">↺ Reset All Chips</button>
          <button class="btn-act btn-primary" id="btnSaveContinue" onclick="saveAndContinue()" disabled>
            ${isLast ? 'Complete Phase 05 & Unlock Final Mock ➔' : 'Save & Next Drill ➔'}
          </button>
        </div>
      `;

      renderChips();
    }

    function renderChips() {
      const staging = document.getElementById("chipsStaging");
      const dropzone = document.getElementById("dropzoneArea");
      const placeholder = document.getElementById("placeholderTxt");
      const btnSave = document.getElementById("btnSaveContinue");

      staging.innerHTML = "";
      unslottedWords.forEach((word, idx) => {
        const chip = document.createElement("button");
        chip.className = "word-chip";
        chip.innerText = word;
        chip.onclick = () => slotWord(idx);
        staging.appendChild(chip);
      });

      dropzone.innerHTML = "";
      if (slottedWords.length === 0) {
        dropzone.appendChild(placeholder);
      } else {
        slottedWords.forEach((word, idx) => {
          const chip = document.createElement("button");
          chip.className = "word-chip slotted";
          chip.innerText = word;
          chip.title = "Click to remove back to pool";
          chip.onclick = () => unslotWord(idx);
          dropzone.appendChild(chip);
        });
      }

      btnSave.disabled = slottedWords.length !== phase5Exercises[currentIndex].fragments.length;
    }

    function slotWord(index) {
      const word = unslottedWords.splice(index, 1)[0];
      slottedWords.push(word);
      renderChips();
    }

    function unslotWord(index) {
      const word = slottedWords.splice(index, 1)[0];
      unslottedWords.push(word);
      renderChips();
    }

    function resetSlots() {
      unslottedWords = [...unslottedWords, ...slottedWords];
      slottedWords = [];
      renderChips();
    }

    function saveAndContinue() {
      const ex = phase5Exercises[currentIndex];
      const built = slottedWords.join(" ").trim();
      if (built.toLowerCase() === ex.target.toLowerCase()) {
        score++;
      }

      if (currentIndex < phase5Exercises.length - 1) {
        currentIndex++;
        renderCurrentExercise();
      } else {
        finishPhase05();
      }
    }

    function finishPhase05() {
      // 1. Marcar Phase 05 como completada en localStorage
      try {
        let profile = JSON.parse(localStorage.getItem(userProfileKey) || "{}");
        if (!profile.phasesCompleted) {
          profile.phasesCompleted = [true, true, true, true, false];
        }
        profile.phasesCompleted[4] = true; // Phase 05 desbloqueada/completada
        localStorage.setItem(userProfileKey, JSON.stringify(profile));
      } catch(e) {
        console.error("Error saving phase 05 status:", e);
      }

      const pct = Math.round((score / 10) * 100);

      // 2. Pantalla de cierre con llamada a la acción hacia el Final Mock
      const container = document.getElementById("mainContainer");
      container.innerHTML = `
        <div class="results-card">
          <div style="font-family:'JetBrains Mono'; font-size:12px; color:var(--accent-gold); font-weight:800; letter-spacing:1.5px; margin-bottom:10px;">
            PHASE 05 COMPLETED • CURRICULAR ROADMAP FINISHED
          </div>
          <h2 class="results-title">Congratulations, ${candidateName}!</h2>
          <p class="results-subtitle">You have successfully mastered all 5 instructional phases of TOEFL iBT Sentence Building.</p>

          <div class="stats-grid">
            <div class="stat-box">
              <div class="stat-val">${score} / 10</div>
              <div class="stat-lbl">Inversion Drills</div>
            </div>
            <div class="stat-box">
              <div class="stat-val">${pct}%</div>
              <div class="stat-lbl">Phase Accuracy</div>
            </div>
            <div class="stat-box">
              <div class="stat-val">5 / 5</div>
              <div class="stat-lbl">Phases Completed</div>
            </div>
          </div>

          <div class="toefl-unlock-box">
            <h4><span>🏆</span> CAPSTONE BENCHMARK UNLOCKED!</h4>
            <p style="font-size:14px; color:#e2e8f0; line-height:1.6; margin-bottom:10px;">
              The <strong>Final Master Mock Exam (50 Items)</strong> is now accessible in your dashboard. Put everything you learned into practice under authentic test conditions and receive your projected <strong>0–30 TOEFL iBT Writing scaled score</strong>.
            </p>
            <p style="font-size:12px; color:var(--text-spanish); font-style:italic;">
              (El simulador final de 50 ejercicios ha sido desbloqueado automáticamente en tu perfil.)
            </p>
          </div>

          <div style="display:flex; justify-content:center; gap:16px; flex-wrap:wrap;">
            <button class="btn-act btn-outline" onclick="window.location.href='./index.html'">
              <span>🏠</span> Return to Roadmap
            </button>
            <button class="btn-act btn-primary btn-mock-launch" onclick="window.location.href='./MOCK%2001.html'">
              <span>⚡</span> Take Final Master Mock Exam (50 Items) ➔
            </button>
          </div>
        </div>
      `;

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    renderCurrentExercise();
  </script>
</body>
</html>
