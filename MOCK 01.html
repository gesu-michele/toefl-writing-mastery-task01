<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOEFL iBT Writing - FINAL MOCK EXAM (Part 1/2) - Dr. Jesús Miguel Lima E.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-canvas: #040914;
      --bg-panel: rgba(10, 19, 36, 0.85);
      --bg-card: rgba(16, 29, 54, 0.7);
      --bg-card-inner: rgba(7, 14, 28, 0.75);
      --border-subtle: rgba(56, 189, 248, 0.15);
      --border-glow: rgba(56, 189, 248, 0.4);
      --border-gold: rgba(212, 175, 55, 0.4);
      --accent-gold: #d4af37;
      --accent-blue: #2563eb;
      --accent-blue-light: #60a5fa;
      --accent-cyan: #38bdf8;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --toefl-brand-blue: #2B2B7A;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-spanish: #8192a9;
      --shadow-deep: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 30px rgba(37, 99, 235, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-canvas);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 85% 15%, rgba(56, 189, 248, 0.18) 0%, transparent 45%),
        radial-gradient(circle at 15% 85%, rgba(212, 175, 55, 0.12) 0%, transparent 45%),
        radial-gradient(circle at 50% 50%, rgba(37, 99, 235, 0.1) 0%, transparent 60%),
        linear-gradient(to bottom, #02050c, #060e1d 60%, #03060f);
      background-attachment: fixed;
    }

    .top-nav {
      height: 64px;
      background: rgba(6, 12, 23, 0.85);
      border-bottom: 1px solid rgba(56, 189, 248, 0.2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 36px;
      backdrop-filter: blur(16px);
      z-index: 100;
    }

    .nav-brand-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .toefl-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #ffffff;
      padding: 4px 10px;
      border-radius: 5px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
      user-select: none;
    }

    .toefl-spark {
      width: 16px;
      height: 16px;
      fill: var(--toefl-brand-blue);
    }

    .toefl-name {
      font-family: 'Inter', sans-serif;
      font-weight: 800;
      font-size: 13.5px;
      color: var(--toefl-brand-blue);
      letter-spacing: -0.4px;
      line-height: 1;
    }

    .nav-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent-cyan);
      letter-spacing: 0.5px;
      font-family: 'Space Grotesk', sans-serif;
      text-transform: uppercase;
    }

    .nav-brand-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .candidate-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      font-weight: 700;
      color: #e2e8f0;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 5px 12px;
      border-radius: 6px;
      backdrop-filter: blur(8px);
    }

    .candidate-tag span {
      color: var(--accent-gold);
    }

    .exam-mode-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(212, 175, 55, 0.15);
      border: 1px solid rgba(212, 175, 55, 0.4);
      padding: 5px 14px;
      border-radius: 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      font-weight: 800;
      color: var(--accent-gold);
    }

    .company-logo-slot {
      height: 38px;
      max-width: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .company-logo-slot img {
      max-height: 100%;
      max-width: 100%;
      object-fit: contain;
    }

    .main-layout {
      flex: 1;
      max-width: 1120px;
      width: 100%;
      margin: 0 auto;
      padding: 30px 24px 40px 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .progress-bar-shell {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      height: 9px;
      border-radius: 9999px;
      margin-bottom: 24px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
    }

    .progress-bar-glow {
      height: 100%;
      width: 4%;
      background: linear-gradient(90deg, #2563eb, #38bdf8, #d4af37);
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.8);
      transition: width 0.3s ease;
    }

    .exercise-card {
      background: var(--bg-card);
      border: 1.5px solid var(--border-subtle);
      border-radius: 20px;
      padding: 36px 44px;
      box-shadow: var(--shadow-deep);
      backdrop-filter: blur(20px);
      position: relative;
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 14px;
    }

    .item-counter {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13.5px;
      font-weight: 800;
      color: var(--accent-gold);
      letter-spacing: 1.5px;
    }

    .item-difficulty-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      color: var(--accent-cyan);
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 4px 10px;
      border-radius: 6px;
    }

    .sentence-prompt {
      font-size: 21.5px;
      line-height: 1.7;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 28px;
    }

    .blank-dropzone {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      min-height: 52px;
      min-width: 240px;
      border: 2px dashed rgba(212, 175, 55, 0.7);
      background: rgba(212, 175, 55, 0.06);
      padding: 4px 10px;
      border-radius: 10px;
      vertical-align: middle;
      gap: 8px;
      box-shadow: inset 0 0 14px rgba(212, 175, 55, 0.1);
    }

    .blank-placeholder {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: rgba(212, 175, 55, 0.7);
      font-weight: 600;
      user-select: none;
      font-style: italic;
    }

    .chips-section-title {
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .chips-staging-area {
      background: var(--bg-card-inner);
      border: 1.5px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 20px;
      min-height: 96px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 26px;
      box-shadow: inset 0 3px 10px rgba(0, 0, 0, 0.6);
    }

    .word-chip {
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 600;
      padding: 10px 18px;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 1.5px solid rgba(96, 165, 250, 0.25);
      color: #f1f5f9;
      border-radius: 10px;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: inline-flex;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .word-chip:hover {
      border-color: var(--accent-cyan);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(56, 189, 248, 0.3);
      color: #ffffff;
    }

    .word-chip.slotted {
      background: linear-gradient(135deg, #1d4ed8 0%, #1e3a8a 100%);
      border-color: #60a5fa;
      color: #ffffff;
    }

    .word-chip.slotted:hover {
      border-color: #ef4444;
      background: linear-gradient(135deg, #991b1b 0%, #7f1d1d 100%);
    }

    .controls-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .btn-act {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 700;
      padding: 13px 26px;
      border-radius: 9px;
      cursor: pointer;
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .btn-outline {
      background: rgba(255, 255, 255, 0.03);
      border-color: rgba(255, 255, 255, 0.15);
      color: #94a3b8;
    }

    .btn-outline:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.3);
    }

    .btn-primary {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: #ffffff;
      border: 1px solid rgba(96, 165, 250, 0.4);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
    }

    .btn-primary:hover:not(:disabled) {
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      transform: translateY(-2px);
    }

    .btn-primary:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      box-shadow: none;
    }

    .results-card {
      background: var(--bg-card);
      border: 1.5px solid var(--border-gold);
      border-radius: 20px;
      padding: 44px 36px;
      text-align: center;
      box-shadow: var(--shadow-deep);
      backdrop-filter: blur(20px);
    }

    .results-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 32px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .results-subtitle {
      font-size: 14.5px;
      color: var(--text-muted);
      margin-bottom: 28px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 16px;
      margin-bottom: 30px;
    }

    .stat-box {
      background: var(--bg-card-inner);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 20px 16px;
    }

    .stat-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 28px;
      font-weight: 800;
      color: var(--accent-gold);
      margin-bottom: 4px;
    }

    .stat-lbl {
      font-size: 11.5px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .audit-section {
      text-align: left;
      margin-top: 36px;
      margin-bottom: 30px;
    }

    .audit-section-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--accent-cyan);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .audit-item-box {
      background: var(--bg-card-inner);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 18px 22px;
      margin-bottom: 14px;
      border-left: 4px solid #334155;
    }

    .audit-item-box.correct {
      border-left-color: var(--accent-green);
    }

    .audit-item-box.incorrect {
      border-left-color: var(--accent-red);
    }

    .audit-item-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 12px;
      font-family: 'JetBrains Mono', monospace;
    }

    .audit-verdict-tag {
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 4px;
    }

    .audit-verdict-tag.correct {
      color: #6ee7b7;
      background: rgba(16, 185, 129, 0.15);
    }

    .audit-verdict-tag.incorrect {
      color: #fca5a5;
      background: rgba(239, 68, 68, 0.15);
    }

    .audit-prompt {
      font-size: 14.5px;
      color: #cbd5e1;
      margin-bottom: 8px;
      line-height: 1.5;
    }

    .audit-line {
      font-size: 13.5px;
      margin-bottom: 4px;
      line-height: 1.4;
    }

    .audit-line strong {
      font-weight: 700;
    }

    .audit-rule-hint {
      font-size: 12px;
      font-style: italic;
      color: var(--accent-gold);
      margin-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 6px;
    }

    .footer-bar {
      padding: 14px 36px;
      background: #02050c;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: #64748b;
    }

    @media (max-width: 860px) {
      .exercise-card {
        padding: 26px 20px;
      }
      .sentence-prompt {
        font-size: 18px;
      }
      .top-nav {
        padding: 0 18px;
      }
      .controls-row {
        flex-direction: column-reverse;
      }
      .btn-act {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <header class="top-nav">
    <div class="nav-brand-left">
      <div class="toefl-badge">
        <svg class="toefl-spark" viewBox="0 0 100 100">
          <rect x="42" y="8" width="16" height="84" rx="4" transform="rotate(0 50 50)"/>
          <rect x="42" y="8" width="16" height="84" rx="4" transform="rotate(60 50 50)"/>
          <rect x="42" y="8" width="16" height="84" rx="4" transform="rotate(120 50 50)"/>
        </svg>
        <span class="toefl-name">toefl ibt</span>
      </div>
      <span class="nav-title">FINAL MOCK • PART 1</span>
    </div>

    <div class="nav-brand-right">
      <div class="candidate-tag">Candidate: <span id="displayCandidate">Candidate</span></div>
      <div class="exam-mode-badge"><span>✍️</span> SIMULATION MODE</div>
      <div class="company-logo-slot">
        <img src="logo.png" alt="JM ELT Solutions" onerror="this.style.display='none'">
      </div>
    </div>
  </header>

  <main class="main-layout" id="mainContainer">
    <div class="progress-bar-shell">
      <div class="progress-bar-glow" id="progressBar"></div>
    </div>

    <div class="exercise-card" id="cardContainer">
      <!-- Inyectado dinámicamente -->
    </div>
  </main>

  <footer class="footer-bar">
    <span>TOEFL iBT Writing: Build a Sentence • Master Benchmark</span>
    <span>Supervised by <strong>Dr. Jesús Miguel Lima E.</strong> • JM ELT Solutions</span>
  </footer>

  <script>
    const mockExercises = [
      {
        id: 1,
        level: "Level 1: Core Backbone",
        pre: "In many arid regions,",
        post: "poses an existential threat to subsistence farmers.",
        fragments: ["the", "gradual", "depletion", "of", "ancient", "subterranean", "aquifers"],
        target: "the gradual depletion of ancient subterranean aquifers",
        hint: "Isolate the singular head noun 'depletion' to agree with 'poses'."
      },
      {
        id: 2,
        level: "Level 1: Core Backbone",
        pre: "The laboratory audit confirmed that",
        post: "during the refrigeration breakdown.",
        fragments: ["almost", "every", "viable", "bacterial", "culture", "had", "perished"],
        target: "almost every viable bacterial culture had perished",
        hint: "Construct the complete past perfect predicate ('had perished') following the subject."
      },
      {
        id: 3,
        level: "Level 1: Core Backbone",
        pre: "After reviewing the seismic telemetry,",
        post: "to halt all drilling operations.",
        fragments: ["the", "lead", "geological", "consultants", "unanimously", "advised", "authorities"],
        target: "the lead geological consultants unanimously advised authorities",
        hint: "Follow the introductory dependent clause with the main subject and preverbal adverb."
      },
      {
        id: 4,
        level: "Level 1: Core Backbone",
        pre: "The firewall continuously inspects incoming traffic, flags protocol anomalies,",
        post: "before data exfiltration occurs.",
        fragments: ["and", "quarantines", "potentially", "compromised", "workstations"],
        target: "and quarantines potentially compromised workstations",
        hint: "Maintain strict parallelism with 'inspects..., flags..., and quarantines...'."
      },
      {
        id: 5,
        level: "Level 1: Core Backbone",
        pre: "Educational metrics demonstrate that",
        post: "directly correlates with long-term analytical performance.",
        fragments: ["early", "and", "sustained", "engagement", "with", "abstract", "mathematics"],
        target: "early and sustained engagement with abstract mathematics",
        hint: "Identify the singular non-count core noun 'engagement'."
      },
      {
        id: 6,
        level: "Level 1: Core Backbone",
        pre: "Archival records reveal that",
        post: "across the frontier months before open warfare erupted.",
        fragments: ["illicit", "consignments", "of", "heavy", "munitions", "were", "smuggled"],
        target: "illicit consignments of heavy munitions were smuggled",
        hint: "Ensure the passive auxiliary and participle complete the subordinate clause predicate."
      },
      {
        id: 7,
        level: "Level 1: Core Backbone",
        pre: "Lacking modern computational navigation,",
        post: "accurately plot transatlantic routes during winter storms.",
        fragments: ["eighteenth-century", "merchant", "captains", "could", "rarely", "if", "ever"],
        target: "eighteenth-century merchant captains could rarely if ever",
        hint: "Position the subject before the complex modal negative adverbial chain."
      },
      {
        id: 8,
        level: "Level 1: Core Backbone",
        pre: "The committee awards honorary fellowships based on pioneering research, international acclaim,",
        post: "to public education.",
        fragments: ["and", "an", "unswerving", "devotion"],
        target: "and an unswerving devotion",
        hint: "Coordinate the final noun phrase using parallel article-adjective-noun structure."
      },
      {
        id: 9,
        level: "Level 1: Core Backbone",
        pre: "Several medieval treatises",
        post: "have finally been translated into contemporary English.",
        fragments: ["long", "assumed", "to", "have", "been", "lost"],
        target: "long assumed to have been lost",
        hint: "Insert the reduced passive participle phrase directly modifying 'treatises'."
      },
      {
        id: 10,
        level: "Level 1: Core Backbone",
        pre: "What perplexed the forensic investigators most",
        post: "throughout the regional servers.",
        fragments: ["was", "the", "meticulous", "erasure", "of", "system", "logs"],
        target: "was the meticulous erasure of system logs",
        hint: "A nominal wh-clause subject takes a singular linking verb followed by the predicate noun phrase."
      },
      {
        id: 11,
        level: "Level 2: Noun Phrase Architecture",
        pre: "Curators at the national gallery unveiled",
        post: "recovered from a sixteenth-century galley.",
        fragments: ["three", "priceless", "intricately", "sculpted", "Hellenistic", "bronzes"],
        target: "three priceless intricately sculpted Hellenistic bronzes",
        hint: "Order of Adjectives: Number + Quality/Value + Participle + Origin + Head Noun."
      },
      {
        id: 12,
        level: "Level 2: Noun Phrase Architecture",
        pre: "Field sociologists observed that neither the lead investigator nor",
        post: "willing to overlook ethical breaches.",
        fragments: ["any", "of", "the", "assisting", "fieldwork", "technicians", "were"],
        target: "any of the assisting fieldwork technicians were",
        hint: "In 'neither... nor', the finite verb agrees with the closer plural subject."
      },
      {
        id: 13,
        level: "Level 2: Noun Phrase Architecture",
        pre: "The appellate court declared that each of the contested",
        post: "fully enforceable under maritime law.",
        fragments: ["bilateral", "territorial", "fishing", "compacts", "remains"],
        target: "bilateral territorial fishing compacts remains",
        hint: "'Each of [plural nouns]' is syntactically singular and requires 'remains'."
      },
      {
        id: 14,
        level: "Level 2: Noun Phrase Architecture",
        pre: "Dr. Marcus Vance,",
        post: "challenged the prevailing consensus on cosmic inflation.",
        fragments: ["a", "prominent", "astrophysicist", "affiliated", "with", "the", "institute,"],
        target: "a prominent astrophysicist affiliated with the institute,",
        hint: "Isolate the non-restrictive appositive noun phrase with its closing comma."
      },
      {
        id: 15,
        level: "Level 2: Noun Phrase Architecture",
        pre: "Facing draconian municipal austerity,",
        post: "managed to maintain community outreach programs.",
        fragments: ["this", "chronically", "underfunded", "civic", "organization", "somehow"],
        target: "this chronically underfunded civic organization somehow",
        hint: "Sequence: Determiner + Adverb + Adjective + Classifier + Noun + Sentence Adverb."
      },
      {
        id: 16,
        level: "Level 2: Noun Phrase Architecture",
        pre: "Recent urban surveys indicate that none of the informal settlements",
        post: "access to chlorinated tap water.",
        fragments: ["flourishing", "on", "the", "city", "outskirts", "presently", "possesses"],
        target: "flourishing on the city outskirts presently possesses",
        hint: "Formal grammar treats 'none' as singular ('possesses') despite the active participle."
      },
      {
        id: 17,
        level: "Level 2: Noun Phrase Architecture",
        pre: "The aerospace contractor presented",
        post: "capable of autonomous planetary exploration.",
        fragments: ["an", "exceptionally", "lightweight", "hexapod", "robotic", "rover"],
        target: "an exceptionally lightweight hexapod robotic rover",
        hint: "Article + Intensifier + Adjective + Premodifier + Classifier + Head Noun."
      },
      {
        id: 18,
        level: "Level 2: Noun Phrase Architecture",
        pre: "Corporate compliance rules mandate that either the chief risk officer or",
        post: "in person at every quarterly briefing.",
        fragments: ["all", "standing", "executive", "committee", "members", "appear"],
        target: "all standing executive committee members appear",
        hint: "The plural subject 'members' closer to the verb dictates the base/plural form 'appear'."
      },
      {
        id: 19,
        level: "Level 2: Noun Phrase Architecture",
        pre: "Anthropologists unearthed remnants of",
        post: "engineered to harvest glacial runoff in arid plateaus.",
        fragments: ["an", "ingenious", "pre-Inca", "stone-lined", "aqueduct", "system"],
        target: "an ingenious pre-Inca stone-lined aqueduct system",
        hint: "Order: Article + Evaluative + Period + Material/Compound + Noun Adj + Head Noun."
      },
      {
        id: 20,
        level: "Level 2: Noun Phrase Architecture",
        pre: "The whistleblower report exposed",
        post: "concealed beneath layers of outsourced auditing.",
        fragments: ["numerous", "glaring", "accounting", "irregularities", "deliberately"],
        target: "numerous glaring accounting irregularities deliberately",
        hint: "Place the quantifier and participle before the noun; the adverb attaches to the participle following."
      },
      {
        id: 21,
        level: "Level 3: Verbal Complex & Regimes",
        pre: "Under intense congressional interrogation, the former commissioner admitted",
        post: "from private defense contractors.",
        fragments: ["to", "having", "accepted", "undisclosed", "honoraria"],
        target: "to having accepted undisclosed honoraria",
        hint: "The verb 'admit' requires the preposition 'to' followed by a gerund structure."
      },
      {
        id: 22,
        level: "Level 3: Verbal Complex & Regimes",
        pre: "Federal trade statutes strictly prohibit executive officers",
        post: "proprietary software blueprints abroad.",
        fragments: ["from", "divulging", "confidential", "commercial", "algorithms", "to"],
        target: "from divulging confidential commercial algorithms to",
        hint: "'Prohibit [object] FROM [gerund]' followed by the directional complement."
      },
      {
        id: 23,
        level: "Level 3: Verbal Complex & Regimes",
        pre: "Weary after round-the-clock negotiations, the ambassadors finally opted",
        post: "until the plenary session.",
        fragments: ["to", "table", "the", "disputed", "border", "resolution"],
        target: "to table the disputed border resolution",
        hint: "'Opt' governs an infinitive phrase with 'to' and its direct object noun phrase."
      },
      {
        id: 24,
        level: "Level 3: Verbal Complex & Regimes",
        pre: "Cognitive therapies are primarily geared toward dissuading anxious patients",
        post: "catastrophizing daily setbacks.",
        fragments: ["from", "reflexively", "and", "habitually"],
        target: "from reflexively and habitually",
        hint: "'Dissuade [someone] FROM' followed by coordinated preverbal frequency adverbs."
      },
      {
        id: 25,
        level: "Level 3: Verbal Complex & Regimes",
        pre: "Confronted with incriminating metadata, the accused technician declined",
        post: "without his legal counsel present.",
        fragments: ["to", "make", "any", "formal", "deposition"],
        target: "to make any formal deposition",
        hint: "'Decline' takes an infinitive with 'to' followed by the collocation 'make a deposition'."
      }
    ];

    let currentIndex = 0;
    let studentResponses = [];
    let slottedWords = [];
    let unslottedWords = [];

    const userProfileKey = "toefl_mastery_user_profile";
    let candidateName = "Candidate";
    try {
      const raw = localStorage.getItem(userProfileKey);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed.name) candidateName = parsed.name;
      }
    } catch(e) {}
    document.getElementById("displayCandidate").innerText = candidateName;

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function renderCurrentExercise() {
      const ex = mockExercises[currentIndex];
      slottedWords = [];
      unslottedWords = shuffleArray(ex.fragments);

      const progressPct = ((currentIndex + 1) / mockExercises.length) * 100;
      document.getElementById("progressBar").style.width = `${progressPct}%`;

      const card = document.getElementById("cardContainer");
      const isLast = currentIndex === mockExercises.length - 1;

      card.innerHTML = `
        <div class="item-header">
          <span class="item-counter">ITEM ${String(ex.id).padStart(2, '0')} / 25</span>
          <span class="item-difficulty-pill">${ex.level}</span>
        </div>

        <div class="sentence-prompt">
          ${ex.pre}
          <span class="blank-dropzone" id="dropzoneArea">
            <span class="blank-placeholder" id="placeholderTxt">Click chips below to slot here...</span>
          </span>
          ${ex.post}
        </div>

        <div class="chips-section-title">
          <span>🧩</span> AVAILABLE SYNTACTIC CHIPS (CLICK TO INSERT • CLICK SLOTTED TO REMOVE):
        </div>
        <div class="chips-staging-area" id="chipsStaging"></div>

        <div class="controls-row">
          <button class="btn-act btn-outline" id="btnReset" onclick="resetSlots()">↺ Reset All Chips</button>
          <button class="btn-act btn-primary" id="btnSaveContinue" onclick="saveAndContinue()" disabled>
            ${isLast ? 'Finish & Submit Part 1 ➔' : 'Save & Next Question ➔'}
          </button>
        </div>
      `;

      renderChips();
    }

    function renderChips() {
      const staging = document.getElementById("chipsStaging");
      const dropzone = document.getElementById("dropzoneArea");
      const placeholder = document.getElementById("placeholderTxt");
      const btnSave = document.getElementById("btnSaveContinue");

      staging.innerHTML = "";
      unslottedWords.forEach((word, idx) => {
        const chip = document.createElement("button");
        chip.className = "word-chip";
        chip.innerText = word;
        chip.onclick = () => slotWord(idx);
        staging.appendChild(chip);
      });

      dropzone.innerHTML = "";
      if (slottedWords.length === 0) {
        dropzone.appendChild(placeholder);
      } else {
        slottedWords.forEach((word, idx) => {
          const chip = document.createElement("button");
          chip.className = "word-chip slotted";
          chip.innerText = word;
          chip.title = "Click to remove back to pool";
          chip.onclick = () => unslotWord(idx);
          dropzone.appendChild(chip);
        });
      }

      btnSave.disabled = slottedWords.length !== mockExercises[currentIndex].fragments.length;
    }

    function slotWord(index) {
      const word = unslottedWords.splice(index, 1)[0];
      slottedWords.push(word);
      renderChips();
    }

    function unslotWord(index) {
      const word = slottedWords.splice(index, 1)[0];
      unslottedWords.push(word);
      renderChips();
    }

    function resetSlots() {
      unslottedWords = [...unslottedWords, ...slottedWords];
      slottedWords = [];
      renderChips();
    }

    function saveAndContinue() {
      const ex = mockExercises[currentIndex];
      const builtSentence = slottedWords.join(" ").trim();
      const isCorrect = builtSentence.toLowerCase() === ex.target.toLowerCase();

      studentResponses.push({
        id: ex.id,
        level: ex.level,
        pre: ex.pre,
        post: ex.post,
        target: ex.target,
        submitted: builtSentence,
        isCorrect: isCorrect,
        hint: ex.hint
      });

      if (currentIndex < mockExercises.length - 1) {
        currentIndex++;
        renderCurrentExercise();
      } else {
        renderComprehensiveAuditReport();
      }
    }

    function renderComprehensiveAuditReport() {
      const correctCount = studentResponses.filter(r => r.isCorrect).length;
      const pct = Math.round((correctCount / 25) * 100);
      const scaledSubscore = ((correctCount / 25) * 15).toFixed(1);

      const mockStorageKey = "toefl_mock_results";
      let mockData = { part1Score: correctCount, totalPart1: 25, part2Score: 0, totalPart2: 25 };
      try {
        const stored = localStorage.getItem(mockStorageKey);
        if (stored) mockData = { ...mockData, ...JSON.parse(stored) };
        mockData.part1Score = correctCount;
        localStorage.setItem(mockStorageKey, JSON.stringify(mockData));
      } catch(e) {}

      let band = "High Precision (C1)";
      let advice = "Superb structural command across complex noun modification and verb regimes. You are fully prepared for Part 2.";
      if (pct < 70) {
        band = "Developing Mastery (B2)";
        advice = "Frequent breaks in long prenominal chains and non-count agreement. Review Phase 02 before attempting Part 2.";
      } else if (pct < 85) {
        band = "Competent (B2+)";
        advice = "Solid foundation. Pay special attention to partitive subjects and verbal prepositions.";
      }

      const auditHtml = studentResponses.map(item => {
        const statusClass = item.isCorrect ? "correct" : "incorrect";
        const verdictText = item.isCorrect ? "✓ CORRECT" : "✗ SYNTACTIC BREAK";

        return `
          <div class="audit-item-box ${statusClass}">
            <div class="audit-item-header">
              <span style="color:var(--text-muted);">ITEM ${String(item.id).padStart(2, '0')} • ${item.level}</span>
              <span class="audit-verdict-tag ${statusClass}">${verdictText}</span>
            </div>
            <div class="audit-prompt">
              <em>${item.pre}</em> <strong>[ ... ]</strong> <em>${item.post}</em>
            </div>
            <div class="audit-line" style="color:${item.isCorrect ? '#6ee7b7' : '#fca5a5'};">
              <strong>Your Input:</strong> ${item.submitted}
            </div>
            ${!item.isCorrect ? `
              <div class="audit-line" style="color:#38bdf8;">
                <strong>Standard Target Order:</strong> ${item.target}
              </div>
            ` : ''}
            <div class="audit-rule-hint">
              <span>📎 Syntactic Principle:</span> ${item.hint}
            </div>
          </div>
        `;
      }).join('');

      const container = document.getElementById("mainContainer");
      container.innerHTML = `
        <div class="results-card">
          <div style="font-family:'JetBrains Mono'; font-size:12px; color:var(--accent-gold); font-weight:800; letter-spacing:1.5px; margin-bottom:10px;">
            OFFICIAL DIAGNOSTIC BENCHMARK REPORT
          </div>
          <h2 class="results-title">Part 1 Completion Assessment</h2>
          <p class="results-subtitle">Candidate: <strong>${candidateName}</strong> • Items 01 to 25 Evaluated</p>

          <div class="stats-grid">
            <div class="stat-box">
              <div class="stat-val">${correctCount} / 25</div>
              <div class="stat-lbl">Correct Drills</div>
            </div>
            <div class="stat-box">
              <div class="stat-val">${pct}%</div>
              <div class="stat-lbl">Syntactic Precision</div>
            </div>
            <div class="stat-box">
              <div class="stat-val">${scaledSubscore} / 15</div>
              <div class="stat-lbl">Subscore Proj.</div>
            </div>
          </div>

          <div class="toefl-rubric-box" style="background:rgba(43,43,122,0.3); border:1px solid rgba(96,165,250,0.35); border-radius:14px; padding:24px; text-align:left;">
            <h4 style="font-size:15px; font-weight:700; color:#60a5fa; margin-bottom:8px; display:flex; align-items:center; gap:8px;">
              <span>📊</span> Diagnostic Category: ${band}
            </h4>
            <p style="font-size:14px; color:#cbd5e1; line-height:1.6;">${advice}</p>
            <p style="font-size:12px; color:var(--text-spanish); font-style:italic; margin-top:8px;">
              *Part 2 features negative adverb fronting, conditional inversion without 'if', and calculates your final 0–30 TOEFL iBT score.
            </p>
          </div>

          <div class="audit-section">
            <div class="audit-section-title">
              <span>📋</span> COMPREHENSIVE DRILL-BY-DRILL AUDIT (${correctCount}/25 CORRECT)
            </div>
            ${auditHtml}
          </div>

          <div style="display:flex; justify-content:center; gap:16px; flex-wrap:wrap; margin-top:30px;">
            <button class="btn-act btn-outline" onclick="window.location.href='./index.html'">
              <span>🏠</span> Return to Roadmap
            </button>
            <button class="btn-act btn-primary" onclick="window.location.href='./MOCK%2002.html'">
              <span>🚀</span> Proceed to Part 2 (Items 26–50) ➔
            </button>
          </div>
        </div>
      `;

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    renderCurrentExercise();
  </script>
</body>
</html>
