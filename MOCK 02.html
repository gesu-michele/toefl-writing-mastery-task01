<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOEFL iBT Writing - FINAL MOCK EXAM (Part 2/2) - Dr. Jesús Miguel Lima E.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'AnanthaSignature';
      src: url('Anantha%20Signature%20For%20Personal%20Use.ttf') format('truetype'),
           url('Anantha Signature For Personal Use.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    :root {
      --bg-canvas: #040914;
      --bg-panel: rgba(10, 19, 36, 0.85);
      --bg-card: rgba(16, 29, 54, 0.7);
      --bg-card-inner: rgba(7, 14, 28, 0.75);
      --border-subtle: rgba(56, 189, 248, 0.15);
      --border-glow: rgba(56, 189, 248, 0.4);
      --border-gold: rgba(212, 175, 55, 0.4);
      --accent-gold: #d4af37;
      --accent-gold-soft: rgba(212, 175, 55, 0.12);
      --accent-blue: #2563eb;
      --accent-blue-light: #60a5fa;
      --accent-cyan: #38bdf8;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --toefl-brand-blue: #2B2B7A;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-spanish: #8192a9;
      --shadow-deep: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 30px rgba(37, 99, 235, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-canvas);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 85% 15%, rgba(56, 189, 248, 0.18) 0%, transparent 45%),
        radial-gradient(circle at 15% 85%, rgba(212, 175, 55, 0.12) 0%, transparent 45%),
        radial-gradient(circle at 50% 50%, rgba(37, 99, 235, 0.1) 0%, transparent 60%),
        linear-gradient(to bottom, #02050c, #060e1d 60%, #03060f);
      background-attachment: fixed;
    }

    .top-nav {
      height: 64px;
      background: rgba(6, 12, 23, 0.85);
      border-bottom: 1px solid rgba(56, 189, 248, 0.2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 36px;
      backdrop-filter: blur(16px);
      z-index: 100;
    }

    .nav-brand-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .toefl-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #ffffff;
      padding: 4px 10px;
      border-radius: 5px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
      user-select: none;
    }

    .toefl-spark {
      width: 16px;
      height: 16px;
      fill: var(--toefl-brand-blue);
    }

    .toefl-name {
      font-family: 'Inter', sans-serif;
      font-weight: 800;
      font-size: 13.5px;
      color: var(--toefl-brand-blue);
      letter-spacing: -0.4px;
      line-height: 1;
    }

    .nav-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent-cyan);
      letter-spacing: 0.5px;
      font-family: 'Space Grotesk', sans-serif;
      text-transform: uppercase;
    }

    .nav-brand-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .candidate-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      font-weight: 700;
      color: #e2e8f0;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 5px 12px;
      border-radius: 6px;
      backdrop-filter: blur(8px);
    }

    .candidate-tag span {
      color: var(--accent-gold);
    }

    .exam-mode-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(212, 175, 55, 0.15);
      border: 1px solid rgba(212, 175, 55, 0.4);
      padding: 5px 14px;
      border-radius: 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      font-weight: 800;
      color: var(--accent-gold);
    }

    .company-logo-slot {
      height: 38px;
      max-width: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .company-logo-slot img {
      max-height: 100%;
      max-width: 100%;
      object-fit: contain;
    }

    .main-layout {
      flex: 1;
      max-width: 1120px;
      width: 100%;
      margin: 0 auto;
      padding: 30px 24px 40px 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .progress-bar-shell {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      height: 9px;
      border-radius: 9999px;
      margin-bottom: 24px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
    }

    .progress-bar-glow {
      height: 100%;
      width: 4%;
      background: linear-gradient(90deg, #38bdf8, #2563eb, #d4af37);
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.8);
      transition: width 0.3s ease;
    }

    .exercise-card {
      background: var(--bg-card);
      border: 1.5px solid var(--border-subtle);
      border-radius: 20px;
      padding: 36px 44px;
      box-shadow: var(--shadow-deep);
      backdrop-filter: blur(20px);
      position: relative;
    }

    .exercise-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.6), transparent);
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 14px;
    }

    .item-counter {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13.5px;
      font-weight: 800;
      color: var(--accent-gold);
      letter-spacing: 1.5px;
    }

    .item-difficulty-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      color: var(--accent-cyan);
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 4px 10px;
      border-radius: 6px;
    }

    .sentence-prompt {
      font-size: 21.5px;
      line-height: 1.7;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 28px;
    }

    .blank-dropzone {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      min-height: 52px;
      min-width: 240px;
      border: 2px dashed rgba(212, 175, 55, 0.7);
      background: rgba(212, 175, 55, 0.06);
      padding: 4px 10px;
      border-radius: 10px;
      vertical-align: middle;
      gap: 8px;
      box-shadow: inset 0 0 14px rgba(212, 175, 55, 0.1);
    }

    .blank-placeholder {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: rgba(212, 175, 55, 0.7);
      font-weight: 600;
      user-select: none;
      font-style: italic;
    }

    .chips-section-title {
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .chips-staging-area {
      background: var(--bg-card-inner);
      border: 1.5px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 20px;
      min-height: 96px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 26px;
      box-shadow: inset 0 3px 10px rgba(0, 0, 0, 0.6);
    }

    .word-chip {
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 600;
      padding: 10px 18px;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 1.5px solid rgba(96, 165, 250, 0.25);
      color: #f1f5f9;
      border-radius: 10px;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: inline-flex;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .word-chip:hover {
      border-color: var(--accent-cyan);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(56, 189, 248, 0.3);
      color: #ffffff;
    }

    .word-chip.slotted {
      background: linear-gradient(135deg, #1d4ed8 0%, #1e3a8a 100%);
      border-color: #60a5fa;
      color: #ffffff;
    }

    .word-chip.slotted:hover {
      border-color: #ef4444;
      background: linear-gradient(135deg, #991b1b 0%, #7f1d1d 100%);
    }

    .controls-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .btn-act {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 700;
      padding: 13px 26px;
      border-radius: 9px;
      cursor: pointer;
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .btn-outline {
      background: rgba(255, 255, 255, 0.03);
      border-color: rgba(255, 255, 255, 0.15);
      color: #94a3b8;
    }

    .btn-outline:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.3);
    }

    .btn-primary {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: #ffffff;
      border: 1px solid rgba(96, 165, 250, 0.4);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
    }

    .btn-primary:hover:not(:disabled) {
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      transform: translateY(-2px);
    }

    .btn-primary:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* PANTALLA DE REPORTE FINAL UNIFICADO */
    .results-card {
      background: var(--bg-card);
      border: 1.5px solid var(--border-gold);
      border-radius: 20px;
      padding: 46px 36px;
      text-align: center;
      box-shadow: var(--shadow-deep);
      backdrop-filter: blur(20px);
    }

    .results-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 32px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .results-subtitle {
      font-size: 14.5px;
      color: var(--text-muted);
      margin-bottom: 28px;
    }

    .toefl-score-hero {
      background: linear-gradient(135deg, rgba(43, 43, 122, 0.45) 0%, rgba(7, 14, 28, 0.95) 100%);
      border: 1.5px solid rgba(96, 165, 250, 0.4);
      border-radius: 18px;
      padding: 30px 20px;
      margin-bottom: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .toefl-scaled-number {
      font-family: 'Inter', sans-serif;
      font-size: clamp(56px, 7.5vw, 82px);
      font-weight: 900;
      color: #ffffff;
      line-height: 1;
      letter-spacing: -2px;
    }

    .toefl-scaled-number span {
      font-size: 28px;
      color: var(--accent-gold);
      font-weight: 700;
    }

    .toefl-level-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      padding: 6px 18px;
      border-radius: 9999px;
      margin-top: 12px;
      border: 1px solid;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
      margin-bottom: 30px;
    }

    .stat-box {
      background: var(--bg-card-inner);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 18px 14px;
    }

    .stat-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 24px;
      font-weight: 800;
      color: var(--accent-gold);
      margin-bottom: 4px;
    }

    .stat-lbl {
      font-size: 11.5px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .rubric-breakdown-card {
      background: var(--bg-card-inner);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 24px;
      text-align: left;
      margin-bottom: 32px;
    }

    .rubric-breakdown-card h4 {
      font-size: 15px;
      font-weight: 700;
      color: #60a5fa;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .rubric-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 13.5px;
    }

    .rubric-row:last-child {
      border-bottom: none;
    }

    .rubric-row span:first-child {
      color: #cbd5e1;
    }

    .rubric-row span:last-child {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      color: var(--accent-gold);
    }

    .audit-section {
      text-align: left;
      margin-top: 36px;
      margin-bottom: 30px;
    }

    .audit-section-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--accent-cyan);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .audit-item-box {
      background: var(--bg-card-inner);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 18px 22px;
      margin-bottom: 14px;
      border-left: 4px solid #334155;
    }

    .audit-item-box.correct {
      border-left-color: var(--accent-green);
    }

    .audit-item-box.incorrect {
      border-left-color: var(--accent-red);
    }

    .audit-item-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 12px;
      font-family: 'JetBrains Mono', monospace;
    }

    .audit-verdict-tag {
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 4px;
    }

    .audit-verdict-tag.correct {
      color: #6ee7b7;
      background: rgba(16, 185, 129, 0.15);
    }

    .audit-verdict-tag.incorrect {
      color: #fca5a5;
      background: rgba(239, 68, 68, 0.15);
    }

    .audit-prompt {
      font-size: 14.5px;
      color: #cbd5e1;
      margin-bottom: 8px;
      line-height: 1.5;
    }

    .audit-line {
      font-size: 13.5px;
      margin-bottom: 4px;
      line-height: 1.4;
    }

    .audit-rule-hint {
      font-size: 12px;
      font-style: italic;
      color: var(--accent-gold);
      margin-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 6px;
    }

    .footer-bar {
      padding: 14px 36px;
      background: #02050c;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: #64748b;
    }

    .footer-bar strong {
      color: #cbd5e1;
    }

    @media (max-width: 860px) {
      .exercise-card {
        padding: 26px 20px;
      }
      .sentence-prompt {
        font-size: 18px;
      }
      .top-nav {
        padding: 0 18px;
      }
      .controls-row {
        flex-direction: column-reverse;
      }
      .btn-act {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <header class="top-nav">
    <div class="nav-brand-left">
      <div class="toefl-badge">
        <svg class="toefl-spark" viewBox="0 0 100 100">
          <rect x="42" y="8" width="16" height="84" rx="4" transform="rotate(0 50 50)"/>
          <rect x="42" y="8" width="16" height="84" rx="4" transform="rotate(60 50 50)"/>
          <rect x="42" y="8" width="16" height="84" rx="4" transform="rotate(120 50 50)"/>
        </svg>
        <span class="toefl-name">toefl ibt</span>
      </div>
      <span class="nav-title">FINAL MOCK • PART 2</span>
    </div>

    <div class="nav-brand-right">
      <div class="candidate-tag">Candidate: <span id="displayCandidate">Candidate</span></div>
      <div class="exam-mode-badge"><span>✍️</span> SIMULATION MODE</div>
      <div class="company-logo-slot">
        <img src="logo.png" alt="JM ELT Solutions" onerror="this.style.display='none'">
      </div>
    </div>
  </header>

  <main class="main-layout" id="mainContainer">
    <div class="progress-bar-shell">
      <div class="progress-bar-glow" id="progressBar"></div>
    </div>

    <div class="exercise-card" id="cardContainer">
      <!-- Inyectado dinámicamente -->
    </div>
  </main>

  <footer class="footer-bar">
    <span>TOEFL iBT Writing: Build a Sentence • Master Benchmark</span>
    <span>Supervised by <strong>Dr. Jesús Miguel Lima E.</strong> • JM ELT Solutions</span>
  </footer>

  <script>
    // BANCO EXACTO DE EJERCICIOS 26 AL 50 (Régimen verbal, Cláusulas reducidas e Inversiones)
    const mockExercisesPart2 = [
      {
        id: 26,
        level: "Level 3: Verbal Complex & Regimes",
        pre: "The university board prevented the department chair",
        post: "outside the formal budget cycle.",
        fragments: ["from", "authorizing", "unplanned", "capital", "expenditures"],
        target: "from authorizing unplanned capital expenditures",
        hint: "'Prevent [someone] FROM [gerund]' followed by the compound nominal object."
      },
      {
        id: 27,
        level: "Level 3: Verbal Complex & Regimes",
        pre: "Geneticists attribute the rapid spread of the mutation",
        post: "environmental stressors.",
        fragments: ["to", "its", "unusual", "adaptability", "to"],
        target: "to its unusual adaptability to",
        hint: "'Attribute [A] TO [B]' and the postnominal dependent preposition 'adaptability TO'."
      },
      {
        id: 28,
        level: "Level 3: Verbal Complex & Regimes",
        pre: "The lead researcher apologized to the journal editors",
        post: "incomplete statistical tables.",
        fragments: ["for", "having", "inadvertently", "submitted"],
        target: "for having inadvertently submitted",
        hint: "'Apologize FOR' takes a perfect gerund with an embedded manner adverb."
      },
      {
        id: 29,
        level: "Level 3: Verbal Complex & Regimes",
        pre: "After weeks of testimony, the jury found the defense argument",
        post: "to exonerate the suspect.",
        fragments: ["too", "internally", "contradictory", "and", "vague"],
        target: "too internally contradictory and vague",
        hint: "Complex adjective complement: 'too [adverb + adjective] and [adjective]' governing the infinitive."
      },
      {
        id: 30,
        level: "Level 3: Verbal Complex & Regimes",
        pre: "The committee finally succeeded",
        post: "across all member institutions.",
        fragments: ["in", "implementing", "uniform", "accreditation", "protocols"],
        target: "in implementing uniform accreditation protocols",
        hint: "Collocation: 'succeed IN [gerund]' governing the direct object noun phrase."
      },
      {
        id: 31,
        level: "Level 4: Clauses & Syntactic Expansion",
        pre: "Although global consumption patterns continue to accelerate,",
        post: "comprehensive recycling initiatives.",
        fragments: ["few", "industrialized", "nations", "have", "enacted"],
        target: "few industrialized nations have enacted",
        hint: "Following the concessive clause, position the negative quantifier subject before the present perfect verb."
      },
      {
        id: 32,
        level: "Level 4: Clauses & Syntactic Expansion",
        pre: "Archeologists excavated several clay tablets",
        post: "details of bronze age grain transactions.",
        fragments: ["bearing", "meticulously", "inscribed", "administrative"],
        target: "bearing meticulously inscribed administrative",
        hint: "Reduced relative clause using the active present participle 'bearing' and its premodified object."
      },
      {
        id: 33,
        level: "Level 4: Clauses & Syntactic Expansion",
        pre: "The revised corporate policy requires that every employee",
        post: "before accessing internal servers.",
        fragments: ["complete", "mandatory", "two-factor", "security", "training"],
        target: "complete mandatory two-factor security training",
        hint: "Mandative subjunctive: 'requires that [subject] + [base form verb]' without third-person -s."
      },
      {
        id: 34,
        level: "Level 4: Clauses & Syntactic Expansion",
        pre: "Unless regulatory bodies impose stricter caps on emissions,",
        post: "severe irreversible ecological harm.",
        fragments: ["coastal", "wetlands", "will", "continue", "facing"],
        target: "coastal wetlands will continue facing",
        hint: "First conditional result clause: subject + future modal 'will' + aspectual verb + gerund."
      },
      {
        id: 35,
        level: "Level 4: Clauses & Syntactic Expansion",
        pre: "The medical breakthrough,",
        post: "promises to lower mortality rates.",
        fragments: ["initially", "met", "with", "widespread", "skepticism,"],
        target: "initially met with widespread skepticism,",
        hint: "Reduced non-restrictive relative clause: past participle phrase enclosed by commas."
      },
      {
        id: 36,
        level: "Level 4: Clauses & Syntactic Expansion",
        pre: "Because regional temperatures dropped beneath historical averages,",
        post: "throughout the agricultural valley.",
        fragments: ["citrus", "harvests", "suffered", "catastrophic", "frost", "damage"],
        target: "citrus harvests suffered catastrophic frost damage",
        hint: "Causal construction: main clause subject + transitive verb + compound direct object."
      },
      {
        id: 37,
        level: "Level 4: Clauses & Syntactic Expansion",
        pre: "The newly installed filtration mechanism,",
        post: "operates continuously.",
        fragments: ["specifically", "engineered", "to", "remove", "heavy", "metals,"],
        target: "specifically engineered to remove heavy metals,",
        hint: "Reduced passive participle modifier with an infinitive of purpose, closed with a comma."
      },
      {
        id: 38,
        level: "Level 4: Clauses & Syntactic Expansion",
        pre: "Even though funding was drastically curtailed midway through the fiscal year,",
        post: "the planetary probe.",
        fragments: ["the", "aerospace", "engineers", "managed", "to", "launch"],
        target: "the aerospace engineers managed to launch",
        hint: "Concessive balance: main clause subject followed by the catenative verb 'managed to [infinitive]'."
      },
      {
        id: 39,
        level: "Level 4: Clauses & Syntactic Expansion",
        pre: "Satellite imagery captured large plumes of smoke",
        post: "across the southern hemisphere.",
        fragments: ["originating", "from", "uncontrolled", "subtropical", "wildfires"],
        target: "originating from uncontrolled subtropical wildfires",
        hint: "Postnominal reduced active participle clause with the dependent preposition 'from'."
      },
      {
        id: 40,
        level: "Level 4: Clauses & Syntactic Expansion",
        pre: "The curriculum committee recommends that modern history programs",
        post: "primary archival documentation.",
        fragments: ["incorporate", "greater", "direct", "analysis", "of"],
        target: "incorporate greater direct analysis of",
        hint: "Subjunctive clause requirement: base verb form followed by comparative noun phrase and 'of'."
      },
      {
        id: 41,
        level: "Level 5: Elite Syntactic Inversion",
        pre: "Not only did the clinical trial confirm the vaccine's safety,",
        post: "long-lasting immune response.",
        fragments: ["but", "it", "also", "induced", "a"],
        target: "but it also induced a",
        hint: "Correlative inversion balance: 'Not only did S V..., but [subject] also [finite verb] [article]'."
      },
      {
        id: 42,
        level: "Level 5: Elite Syntactic Inversion",
        pre: "Under no circumstances should",
        post: "in unventilated laboratory cabinets.",
        fragments: ["volatile", "organic", "solvents", "be", "stored"],
        target: "volatile organic solvents be stored",
        hint: "Negative prepositional phrase fronting: Auxiliary ('should') + Subject + Passive base verb."
      },
      {
        id: 43,
        level: "Level 5: Elite Syntactic Inversion",
        pre: "Seldom have planetary astronomers observed",
        post: "during a single solar cycle.",
        fragments: ["so", "many", "consecutive", "coronal", "mass", "ejections"],
        target: "so many consecutive coronal mass ejections",
        hint: "Negative frequency inversion already fronted; assemble the intensified quantifier direct object."
      },
      {
        id: 44,
        level: "Level 5: Elite Syntactic Inversion",
        pre: "Had the architectural engineers reinforced the foundation pilings,",
        post: "the seismic shockwaves.",
        fragments: ["the", "bridge", "would", "have", "withstood"],
        target: "the bridge would have withstood",
        hint: "Inverted past contrafactual conditional: 'Had S V-ed, [subject] would have [past participle]'."
      },
      {
        id: 45,
        level: "Level 5: Elite Syntactic Inversion",
        pre: "Rarely does a single economic factor",
        post: "of international commodity markets.",
        fragments: ["dictate", "the", "overall", "pricing", "structure"],
        target: "dictate the overall pricing structure",
        hint: "Negative adverb fronting ('Rarely does [subject]') requires the base form transitive verb."
      },
      {
        id: 46,
        level: "Level 5: Elite Syntactic Inversion",
        pre: "Were the state legislature to repeal the current subsidies,",
        post: "into financial insolvency.",
        fragments: ["several", "renewable", "energy", "firms", "would", "fall"],
        target: "several renewable energy firms would fall",
        hint: "Inverted second conditional: 'Were [subject] to [verb], [matrix subject] would [base verb]'."
      },
      {
        id: 47,
        level: "Level 5: Elite Syntactic Inversion",
        pre: "Hardly had the treaty been ratified by parliament",
        post: "protests erupted in capital cities.",
        fragments: ["when", "massive", "public", "demonstrations", "and"],
        target: "when massive public demonstrations and",
        hint: "Correlative time inversion: 'Hardly had [S] [V-ed] WHEN [coordinated subject] [verb]'."
      },
      {
        id: 48,
        level: "Level 5: Elite Syntactic Inversion",
        pre: "Scarcely had the deep-sea submersible reached the trench",
        post: "began reporting critical sensor errors.",
        fragments: ["before", "the", "onboard", "navigation", "system"],
        target: "before the onboard navigation system",
        hint: "Correlative inversion: 'Scarcely had [S] [V-ed] BEFORE [subject noun phrase] [verb]'."
      },
      {
        id: 49,
        level: "Level 5: Elite Syntactic Inversion",
        pre: "Should unanticipated anomalies arise during orbital insertion,",
        post: "to override automated thrusters.",
        fragments: ["ground", "controllers", "are", "authorized", "manually"],
        target: "ground controllers are authorized manually",
        hint: "Inverted first conditional: 'Should [S] [V], [main subject] are authorized [adverb] [infinitive]'."
      },
      {
        id: 50,
        level: "Level 5: Elite Syntactic Inversion",
        pre: "Little did the nineteenth-century botanists suspect",
        post: "the primary driver of rainforest pollination.",
        fragments: ["that", "nocturnal", "moths", "were", "actually"],
        target: "that nocturnal moths were actually",
        hint: "Negative degree fronting: 'Little did [S] suspect THAT [subject] were [adverb] [complement]'."
      }
    ];

    let currentIndex = 0;
    let studentResponsesPart2 = [];
    let slottedWords = [];
    let unslottedWords = [];

    // Cargar perfil y puntaje de la Parte 1
    const userProfileKey = "toefl_mastery_user_profile";
    const mockStorageKey = "toefl_mock_results";

    let candidateName = "Candidate";
    let scorePart1 = 0;

    try {
      const rawProfile = localStorage.getItem(userProfileKey);
      if (rawProfile) {
        const parsed = JSON.parse(rawProfile);
        if (parsed.name) candidateName = parsed.name;
      }
    } catch(e) {}

    try {
      const rawMock = localStorage.getItem(mockStorageKey);
      if (rawMock) {
        const parsed = JSON.parse(rawMock);
        if (typeof parsed.part1Score === 'number') scorePart1 = parsed.part1Score;
      }
    } catch(e) {}

    document.getElementById("displayCandidate").innerText = candidateName;

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function renderCurrentExercise() {
      const ex = mockExercisesPart2[currentIndex];
      slottedWords = [];
      unslottedWords = shuffleArray(ex.fragments);

      const progressPct = ((currentIndex + 1) / mockExercisesPart2.length) * 100;
      document.getElementById("progressBar").style.width = `${progressPct}%`;

      const card = document.getElementById("cardContainer");
      const isLast = currentIndex === mockExercisesPart2.length - 1;

      card.innerHTML = `
        <div class="item-header">
          <span class="item-counter">ITEM ${ex.id} / 50</span>
          <span class="item-difficulty-pill">${ex.level}</span>
        </div>

        <div class="sentence-prompt">
          ${ex.pre}
          <span class="blank-dropzone" id="dropzoneArea">
            <span class="blank-placeholder" id="placeholderTxt">Click chips below to slot here...</span>
          </span>
          ${ex.post}
        </div>

        <div class="chips-section-title">
          <span>🧩</span> AVAILABLE SYNTACTIC CHIPS (CLICK TO INSERT • CLICK SLOTTED TO REMOVE):
        </div>
        <div class="chips-staging-area" id="chipsStaging"></div>

        <div class="controls-row">
          <button class="btn-act btn-outline" id="btnReset" onclick="resetSlots()">↺ Reset All Chips</button>
          <button class="btn-act btn-primary" id="btnSaveContinue" onclick="saveAndContinue()" disabled>
            ${isLast ? 'Submit Full Mock for Evaluation ➔' : 'Save & Next Question ➔'}
          </button>
        </div>
      `;

      renderChips();
    }

    function renderChips() {
      const staging = document.getElementById("chipsStaging");
      const dropzone = document.getElementById("dropzoneArea");
      const placeholder = document.getElementById("placeholderTxt");
      const btnSave = document.getElementById("btnSaveContinue");

      staging.innerHTML = "";
      unslottedWords.forEach((word, idx) => {
        const chip = document.createElement("button");
        chip.className = "word-chip";
        chip.innerText = word;
        chip.onclick = () => slotWord(idx);
        staging.appendChild(chip);
      });

      dropzone.innerHTML = "";
      if (slottedWords.length === 0) {
        dropzone.appendChild(placeholder);
      } else {
        slottedWords.forEach((word, idx) => {
          const chip = document.createElement("button");
          chip.className = "word-chip slotted";
          chip.innerText = word;
          chip.title = "Click to remove back to pool";
          chip.onclick = () => unslotWord(idx);
          dropzone.appendChild(chip);
        });
      }

      btnSave.disabled = slottedWords.length !== mockExercisesPart2[currentIndex].fragments.length;
    }

    function slotWord(index) {
      const word = unslottedWords.splice(index, 1)[0];
      slottedWords.push(word);
      renderChips();
    }

    function unslotWord(index) {
      const word = slottedWords.splice(index, 1)[0];
      unslottedWords.push(word);
      renderChips();
    }

    function resetSlots() {
      unslottedWords = [...unslottedWords, ...slottedWords];
      slottedWords = [];
      renderChips();
    }

    function saveAndContinue() {
      const ex = mockExercisesPart2[currentIndex];
      const builtSentence = slottedWords.join(" ").trim();
      const isCorrect = builtSentence.toLowerCase() === ex.target.toLowerCase();

      studentResponsesPart2.push({
        id: ex.id,
        level: ex.level,
        pre: ex.pre,
        post: ex.post,
        target: ex.target,
        submitted: builtSentence,
        isCorrect: isCorrect,
        hint: ex.hint
      });

      if (currentIndex < mockExercisesPart2.length - 1) {
        currentIndex++;
        renderCurrentExercise();
      } else {
        renderFinalUnifiedReport();
      }
    }

    function renderFinalUnifiedReport() {
      const scorePart2 = studentResponsesPart2.filter(r => r.isCorrect).length;
      const totalCorrect = scorePart1 + scorePart2;
      const accuracyPct = Math.round((totalCorrect / 50) * 100);

      // Conversión a Escala Oficial TOEFL iBT Writing (0 a 30)
      const toeflScaledScore = Math.round((totalCorrect / 50) * 30);

      try {
        const finalResults = {
          candidate: candidateName,
          part1Score: scorePart1,
          part2Score: scorePart2,
          totalCorrect: totalCorrect,
          totalItems: 50,
          toeflScaled: toeflScaledScore,
          accuracy: accuracyPct,
          completedDate: new Date().toISOString()
        };
        localStorage.setItem(mockStorageKey, JSON.stringify(finalResults));
      } catch(e) {}

      // Bandas y Descriptores Oficiales ETS
      let toeflBand = "Advanced (24–30)";
      let bandDescriptor = "Superior syntactic control. Exhibits total confidence across complex negative inversions, contrafactual conditionals without 'if', and dense clausal reductions.";
      let badgeColor = "#38bdf8";

      if (toeflScaledScore >= 24) {
        toeflBand = "Advanced (24–30)";
        bandDescriptor = "Superior syntactic control. Natural command of high-level inversions, precise non-finite complementation, and sophisticated prenominal architecture.";
        badgeColor = "#38bdf8";
      } else if (toeflScaledScore >= 17) {
        toeflBand = "High-Intermediate (17–23)";
        bandDescriptor = "Solid syntactic core with occasional breaks in negative adverb fronting or subjunctive auxiliary selection. Highly competent in standard academic prose.";
        badgeColor = "#d4af37";
      } else if (toeflScaledScore >= 13) {
        toeflBand = "Low-Intermediate (13–16)";
        bandDescriptor = "Basic clause integrity is stable, but marked vulnerability occurs when assembling complex inversions, correlatives, and dependent verbal regimes.";
        badgeColor = "#f97316";
      } else {
        toeflBand = "Below Low-Intermediate (0–12)";
        bandDescriptor = "Frequent structural breakdown across compound and complex sentences. Systematic revision of core S-V agreement and subordinate conjunctions is required.";
        badgeColor = "#ef4444";
      }

      // Desglose auditoría de la Parte 2
      const auditHtml = studentResponsesPart2.map(item => {
        const statusClass = item.isCorrect ? "correct" : "incorrect";
        const verdictText = item.isCorrect ? "✓ CORRECT" : "✗ SYNTACTIC BREAK";

        return `
          <div class="audit-item-box ${statusClass}">
            <div class="audit-item-header">
              <span style="color:var(--text-muted);">ITEM ${item.id} • ${item.level}</span>
              <span class="audit-verdict-tag ${statusClass}">${verdictText}</span>
            </div>
            <div class="audit-prompt">
              <em>${item.pre}</em> <strong>[ ... ]</strong> <em>${item.post}</em>
            </div>
            <div class="audit-line" style="color:${item.isCorrect ? '#6ee7b7' : '#fca5a5'};">
              <strong>Your Input:</strong> ${item.submitted}
            </div>
            ${!item.isCorrect ? `
              <div class="audit-line" style="color:#38bdf8;">
                <strong>Standard Target Order:</strong> ${item.target}
              </div>
            ` : ''}
            <div class="audit-rule-hint">
              <span>📎 Syntactic Principle:</span> ${item.hint}
            </div>
          </div>
        `;
      }).join('');

      const container = document.getElementById("mainContainer");
      container.innerHTML = `
        <div class="results-card">
          <div style="font-family:'JetBrains Mono'; font-size:12px; color:var(--accent-gold); font-weight:800; letter-spacing:1.5px; margin-bottom:10px;">
            OFFICIAL BENCHMARK EVALUATION COMPLETE
          </div>
          <h2 class="results-title">Final TOEFL iBT Writing Assessment</h2>
          <p class="results-subtitle">Candidate: <strong>${candidateName}</strong> • Task 1 "Build a Sentence" 50-Item Simulation</p>

          <div class="toefl-score-hero">
            <div style="font-family:'JetBrains Mono'; font-size:12px; color:#cbd5e1; text-transform:uppercase; letter-spacing:1px; margin-bottom:6px;">
              Projected Scaled Score
            </div>
            <div class="toefl-scaled-number">
              ${toeflScaledScore} <span>/ 30</span>
            </div>
            <div class="toefl-level-badge" style="color:${badgeColor}; border-color:${badgeColor}; background:rgba(255,255,255,0.05);">
              ${toeflBand}
            </div>
          </div>

          <div class="stats-grid">
            <div class="stat-box">
              <div class="stat-val">${totalCorrect} / 50</div>
              <div class="stat-lbl">Total Completed</div>
            </div>
            <div class="stat-box">
              <div class="stat-val">${accuracyPct}%</div>
              <div class="stat-lbl">Global Precision</div>
            </div>
            <div class="stat-box">
              <div class="stat-val">${scorePart1} / 25</div>
              <div class="stat-lbl">Part 1 (Core & Phrases)</div>
            </div>
            <div class="stat-box">
              <div class="stat-val">${scorePart2} / 25</div>
              <div class="stat-lbl">Part 2 (Inversion & Clauses)</div>
            </div>
          </div>

          <div class="rubric-breakdown-card">
            <h4><span>📋</span> Performance Analysis & Diagnostic Rubric</h4>
            <div class="rubric-row">
              <span>ETS Performance Band:</span>
              <span>${toeflBand}</span>
            </div>
            <div class="rubric-row">
              <span>Overall Task 01 Competence:</span>
              <span>${accuracyPct >= 80 ? 'Mastered (High Proficiency)' : accuracyPct >= 60 ? 'Competent (Working Command)' : 'Developing (Needs Practice)'}</span>
            </div>
            <div class="rubric-row">
              <span>Elite Syntactic Inversion (Items 41–50):</span>
              <span>${scorePart2 >= 8 ? 'Mastered' : 'Requires Reinforcement'}</span>
            </div>
            <p style="font-size:13.5px; color:#cbd5e1; line-height:1.6; margin-top:14px;">
              ${bandDescriptor}
            </p>
          </div>

          <div class="audit-section">
            <div class="audit-section-title">
              <span>📋</span> PART 2 DRILL-BY-DRILL AUDIT (${scorePart2}/25 CORRECT)
            </div>
            ${auditHtml}
          </div>

          <div style="display:flex; justify-content:center; gap:16px; flex-wrap:wrap; margin-top:30px;">
            <button class="btn-act btn-outline" onclick="window.location.href='./MOCK%2001.html'">
              <span>↺</span> Retake Part 1 (01–25)
            </button>
            <button class="btn-act btn-primary" onclick="window.location.href='./index.html'">
              <span>🏠</span> Return to Central Dashboard ➔
            </button>
          </div>
        </div>
      `;

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    renderCurrentExercise();
  </script>
</body>
</html>
